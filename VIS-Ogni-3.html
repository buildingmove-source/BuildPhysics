<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ВИС Огни 3 | Google Таблица</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Полноэкранный режим для смартфонов */
        html, body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        /* Шапка с крупным названием */
        .header {
            background: rgba(6, 12, 28, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 1rem;
            border-bottom: 2px solid #34a853;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: clamp(1.6rem, 8vw, 2.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #6b8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Текстовая иконка вместо эмодзи */
        .header-icon {
            font-size: clamp(1.8rem, 9vw, 2.5rem);
            color: #34a853;
            display: inline-block;
            margin-right: 0.3rem;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #34a853;
        }

        .header h1 span {
            background: linear-gradient(135deg, #ffffff, #6b8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            text-align: center;
            color: #8a9bdf;
            font-size: clamp(0.8rem, 4vw, 0.9rem);
            margin-top: 0.3rem;
        }

        /* Бейджики */
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.7rem;
        }

        .badge {
            background: #1a2448;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            border: 1px solid #2a3a6e;
            color: #cfdeff;
            font-weight: 500;
        }

        .badge-green {
            background: rgba(52, 168, 83, 0.2);
            border-color: #34a853;
            color: #6fcf97;
        }

        .badge-blue {
            background: rgba(107, 140, 255, 0.2);
            border-color: #6b8cff;
            color: #6b8cff;
        }

        /* Контейнер для таблицы — на весь экран */
        .sheet-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
            position: relative;
            min-height: calc(100vh - 160px);
        }

        .sheet-frame {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 160px);
            border: none;
            background: #ffffff;
            display: block;
        }

        /* Информационная панель внизу */
        .info-bar {
            background: rgba(6, 12, 28, 0.9);
            backdrop-filter: blur(8px);
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: #8a9bdf;
            border-top: 1px solid #2a3a6e;
        }

        .info-bar a {
            color: #34a853;
            text-decoration: none;
            font-weight: bold;
        }

        .info-bar a:hover {
            text-decoration: underline;
        }

        /* Кнопка "На главную" */
        .home-button-global {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #e31b23, #ff4d4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .home-button-global:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(227, 27, 35, 0.6);
        }

        .home-button-global:active {
            transform: scale(0.95);
        }

        .home-button-global::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.6);
            animation: pulseGreen 1.2s infinite;
            z-index: -1;
        }

        @keyframes pulseGreen {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .home-icon-global {
            font-size: 28px;
            color: white;
            transition: transform 0.3s ease;
        }

        .home-button-global:hover .home-icon-global {
            transform: translateY(-2px);
        }

        /* Адаптация для маленьких экранов */
        @media (max-width: 480px) {
            .home-button-global {
                width: 48px;
                height: 48px;
                bottom: 15px;
                right: 15px;
            }
            .home-icon-global {
                font-size: 24px;
            }
            .header {
                padding: 0.8rem 0.8rem;
            }
            .info-bar {
                padding: 0.5rem 0.8rem;
                font-size: 0.6rem;
            }
            .badge {
                padding: 0.2rem 0.6rem;
                font-size: 0.65rem;
            }
        }

        /* Загрузка */
        .loading-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0f2a;
            padding: 1rem 1.5rem;
            border-radius: 60px;
            color: white;
            z-index: 1001;
            border: 1px solid #34a853;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <!-- ШАПКА С КРУПНЫМ НАЗВАНИЕМ (без эмодзи) -->
    <div class="header">
        <h1>
            <span class="header-icon">📊</span>
            <span>ВИС Огни 3</span>
        </h1>
        <p>Информационная система · ЖК «Огни 3»</p>
        <div class="badge-row">
            <span class="badge">АКТУАЛЬНЫЕ ДАННЫЕ</span>
            <span class="badge badge-green">Обновление: ежедневно</span>
            <span class="badge badge-blue">ЗОМ | СС | ОВ | ВК</span>
        </div>
    </div>

    <!-- ТАБЛИЦА НА ВЕСЬ ЭКРАН -->
    <div class="sheet-container">
        <iframe class="sheet-frame" 
                src="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?usp=sharing&rm=minimal"
                title="ВИС Огни 3 - Google Таблица"
                frameborder="0">
        </iframe>
    </div>

    <!-- ИНФОРМАЦИОННАЯ ПАНЕЛЬ -->
    <div class="info-bar">
        <div>📌 Данные актуальны на момент открытия</div>
        <div>🔗 <a href="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?usp=sharing" target="_blank">Открыть в полном окне →</a></div>
    </div>

    <!-- КНОПКА "НА ГЛАВНУЮ" -->
    <a href="https://buildingmove-source.github.io/BuildPhysics/" class="home-button-global">
        <span class="home-icon-global">🏠</span>
    </a>

    <div class="loading-overlay" id="loadingOverlay">
        ⏳ Загрузка таблицы...
    </div>

    <script>
        // Оптимизация для iOS и Android
        const iframe = document.querySelector('.sheet-frame');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        // Фикс для корректного отображения на мобильных устройствах
        function resizeIframe() {
            const windowHeight = window.innerHeight;
            const headerHeight = document.querySelector('.header').offsetHeight;
            const infoHeight = document.querySelector('.info-bar').offsetHeight;
            const availableHeight = windowHeight - headerHeight - infoHeight;
            iframe.style.minHeight = availableHeight + 'px';
            iframe.style.height = availableHeight + 'px';
        }
        
        window.addEventListener('load', resizeIframe);
        window.addEventListener('resize', resizeIframe);
        
        // Показываем загрузку
        iframe.addEventListener('loadstart', function() {
            loadingOverlay.style.display = 'block';
        });
        
        iframe.addEventListener('load', function() {
            loadingOverlay.style.display = 'none';
        });
        
        // Перезагрузка iframe при ошибке
        iframe.addEventListener('error', function() {
            console.log('Перезагрузка таблицы...');
            loadingOverlay.style.display = 'block';
            setTimeout(() => {
                iframe.src = iframe.src;
            }, 1000);
        });
        
        // Дополнительно: если iframe грузится слишком долго
        setTimeout(() => {
            loadingOverlay.style.display = 'none';
        }, 5000);
    </script>
</body>
</html>
