<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ВИС Огни 3 | Google Таблица</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Полный экран без прокрутки */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            background: #0a0f2a;
            font-family: 'Arial', sans-serif;
        }

        /* Основной контейнер */
        .fullscreen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Шапка — ТОЛЬКО кнопка назад */
        .nav-bar {
            background: rgba(6, 12, 28, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-bottom: 1px solid rgba(52, 168, 83, 0.3);
            flex-shrink: 0;
            min-height: 52px;
        }

        .back-btn {
            background: rgba(227, 27, 35, 0.2);
            border: 1px solid #e31b23;
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            color: #eef2ff;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:active {
            transform: scale(0.96);
            background: #e31b23;
        }

        /* Контейнер таблицы — занимает ВСЁ оставшееся место */
        .sheet-wrapper {
            flex: 1;
            width: 100%;
            background: #ffffff;
            position: relative;
            min-height: 0;
        }

        /* iframe на весь экран */
        .sheet-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Скрываем скролл у iframe (таблица скроллится сама) */
        .sheet-frame::-webkit-scrollbar {
            width: 4px;
        }
    </style>
</head>
<body>
    <div class="fullscreen">
        <!-- Только кнопка "На главную" -->
        <div class="nav-bar">
            <a href="https://buildingmove-source.github.io/BuildPhysics/" class="back-btn">
                ← На главную
            </a>
        </div>
        
        <!-- Таблица на весь экран -->
        <div class="sheet-wrapper">
            <iframe class="sheet-frame" 
                    src="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?rm=minimal&widget=true&headers=false"
                    title="ВИС Огни 3">
            </iframe>
        </div>
    </div>
</body>
</html>
