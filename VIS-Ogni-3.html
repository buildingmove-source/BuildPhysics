<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ВИС Огни 3 | Google Таблица</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Полный экран без отступов */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
        }

        /* Контейнер на весь экран */
        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Минимальная шапка для навигации */
        .mini-header {
            background: rgba(6, 12, 28, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(52, 168, 83, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        .title {
            font-weight: 700;
            font-size: 14px;
            background: linear-gradient(135deg, #ffffff, #6b8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            background: rgba(227, 27, 35, 0.2);
            border: 1px solid #e31b23;
            padding: 6px 14px;
            border-radius: 40px;
            text-decoration: none;
            color: #eef2ff;
            font-size: 12px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: #e31b23;
            transform: scale(1.02);
        }

        /* Контейнер для iframe — занимает всё оставшееся место */
        .iframe-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
            position: relative;
        }

        .sheet-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Скрываем скролл у iframe на некоторых устройствах */
        .sheet-frame::-webkit-scrollbar {
            display: none;
        }

        /* Для очень маленьких экранов */
        @media (max-width: 480px) {
            .mini-header {
                padding: 10px 12px;
            }
            .title {
                font-size: 12px;
            }
            .back-btn {
                padding: 5px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <!-- Минимальная шапка -->
        <div class="mini-header">
            <span class="title">📊 ВИС Огни 3 · Google Таблица</span>
            <a href="https://buildingmove-source.github.io/BuildPhysics/" class="back-btn">← На главную</a>
        </div>
        
        <!-- Таблица на весь экран -->
        <div class="iframe-container">
            <iframe class="sheet-frame" 
                    src="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?usp=sharing&rm=minimal"
                    title="ВИС Огни 3 - Google Таблица">
            </iframe>
        </div>
    </div>
</body>
</html>
