<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>ВИС Огни 3 | Google Таблица</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Занимаем 100% высоты экрана */
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            padding: 0;
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        /* Шапка — минимальная высота, компактная */
        .header {
            background: rgba(6, 12, 28, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 8px;
            border-bottom: 1px solid rgba(227, 27, 35, 0.3);
            flex-shrink: 0;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .title-section h1 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            background: #34a853;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .back-btn {
            background: rgba(227, 27, 35, 0.2);
            border: 1px solid #e31b23;
            padding: 4px 10px;
            border-radius: 30px;
            text-decoration: none;
            color: #eef2ff;
            font-size: 11px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #e31b23;
        }

        /* Контейнер для iframe — занимает всё оставшееся пространство */
        .sheet-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .sheet-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Информационная полоска — минимальная высота */
        .info-bar {
            background: rgba(6, 12, 28, 0.9);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 9px;
            color: #7a8bc5;
            border-top: 1px solid rgba(227, 27, 35, 0.2);
            flex-shrink: 0;
        }

        .info-bar a {
            color: #34a853;
            text-decoration: none;
        }

        .info-bar a:hover {
            text-decoration: underline;
        }

        /* Скрываем скролл у body */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title-section">
            <span style="font-size: 16px;">📊</span>
            <h1>ВИС Огни 3</h1>
            <span class="badge">Google</span>
        </div>
        <a href="https://buildingmove-source.github.io/BuildPhysics/" class="back-btn">
            ← На главную
        </a>
    </div>

    <div class="sheet-container">
        <iframe class="sheet-frame" 
                src="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?usp=sharing&rm=minimal&widget=true&headers=false"
                title="ВИС Огни 3 - Google Таблица"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
        </iframe>
    </div>

    <div class="info-bar">
        <span>📌 Актуальные данные</span>
        <span>🔗 <a href="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Открыть в Google Sheets →</a></span>
    </div>
</div>

<!-- Кнопка "На главную" с зелёной пульсацией -->
<style>
    .home-button-global {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #e31b23, #ff4d4d);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
        transition: all 0.3s ease;
        z-index: 1000;
        text-decoration: none;
        border: 2px solid rgba(255, 255, 255, 0.3);
    }
    .home-button-global:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 25px rgba(227, 27, 35, 0.6);
    }
    .home-button-global:active {
        transform: scale(0.95);
    }
    .home-button-global::after {
        content: '';
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        border-radius: 50%;
        background: rgba(46, 204, 113, 0.6);
        animation: pulseGreen 1.2s infinite;
        z-index: -1;
    }
    @keyframes pulseGreen {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.4); opacity: 0; }
    }
    .home-icon-global {
        font-size: 28px;
        color: white;
        transition: transform 0.3s ease;
    }
    .home-button-global:hover .home-icon-global {
        transform: translateY(-2px);
    }
    @media (max-width: 480px) {
        .home-button-global {
            width: 48px;
            height: 48px;
            bottom: 15px;
            right: 15px;
        }
        .home-icon-global {
            font-size: 24px;
        }
    }
</style>

<a href="https://buildingmove-source.github.io/BuildPhysics/" class="home-button-global">
    <span class="home-icon-global">🏠</span>
</a>
</body>
</html>
