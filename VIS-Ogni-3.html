<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ВИС Огни 3 | Google Таблица</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Полноэкранный режим */
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* Таблица на весь экран */
        .sheet-container {
            flex: 1;
            width: 100%;
            background: #ffffff;
            position: relative;
            min-height: 100vh;
        }

        .sheet-frame {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            border: none;
            background: #ffffff;
            display: block;
        }

        /* Кнопка "На главную" */
        .home-button-global {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #e31b23, #ff4d4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .home-button-global:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(227, 27, 35, 0.6);
        }

        .home-button-global:active {
            transform: scale(0.95);
        }

        .home-button-global::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.6);
            animation: pulseGreen 1.2s infinite;
            z-index: -1;
        }

        @keyframes pulseGreen {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .home-icon-global {
            font-size: 28px;
            color: white;
            transition: transform 0.3s ease;
        }

        .home-button-global:hover .home-icon-global {
            transform: translateY(-2px);
        }

        /* Адаптация для маленьких экранов */
        @media (max-width: 480px) {
            .home-button-global {
                width: 48px;
                height: 48px;
                bottom: 15px;
                right: 15px;
            }
            .home-icon-global {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- ТАБЛИЦА НА ВЕСЬ ЭКРАН (БЕЗ ШАПКИ) -->
    <div class="sheet-container">
        <iframe class="sheet-frame" 
                src="https://docs.google.com/spreadsheets/d/1qk82fexjMJVuzs4caGcpdoPMGXKccXmE2lSc4LUlEw0/edit?usp=sharing&rm=minimal"
                title="ВИС Огни 3 - Google Таблица"
                frameborder="0">
        </iframe>
    </div>

    <!-- КНОПКА "НА ГЛАВНУЮ" -->
    <a href="https://buildingmove-source.github.io/BuildPhysics/" class="home-button-global">
        <span class="home-icon-global">🏠</span>
    </a>

    <script>
        // Оптимизация для iOS и Android
        const iframe = document.querySelector('.sheet-frame');
        
        function resizeIframe() {
            const windowHeight = window.innerHeight;
            iframe.style.minHeight = windowHeight + 'px';
            iframe.style.height = windowHeight + 'px';
        }
        
        window.addEventListener('load', resizeIframe);
        window.addEventListener('resize', resizeIframe);
        
        // Перезагрузка iframe при ошибке
        iframe.addEventListener('error', function() {
            setTimeout(() => {
                iframe.src = iframe.src;
            }, 1000);
        });
    </script>
</body>
</html>
