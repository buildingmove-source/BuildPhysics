<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#1A1A2E">
    <title>Архив ресурсов · Огни 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1A1A2E;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #EEEEEE;
            line-height: 1.5;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(22, 30, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.75rem 1.5rem;
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .logo-icon {
            background: linear-gradient(135deg, #2D6AFF, #00B4D8);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: all 0.3s;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #00B4D8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-search {
            flex: 1;
            max-width: 360px;
        }

        .nav-search input {
            width: 100%;
            padding: 0.7rem 1.2rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            color: white;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-search input:focus {
            outline: none;
            background: rgba(255,255,255,0.1);
            border-color: #2D6AFF;
        }

        .nav-search input::placeholder {
            color: #5A6BA0;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #8A9BDF;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(45, 106, 255, 0.15);
            color: #00B4D8;
        }

        .main-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .archive-header {
            margin-bottom: 2rem;
        }

        .archive-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #2D6AFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .archive-subtitle {
            color: #8A9BDF;
            font-size: 0.9rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: #16213E;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            flex: 1;
            min-width: 150px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #2D6AFF;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #8A9BDF;
            margin-top: 0.3rem;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .file-card {
            background: #16213E;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .file-card:hover {
            transform: translateY(-4px);
            border-color: #2D6AFF;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.5);
        }

        .file-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #2D6AFF, #00B4D8);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .file-card:hover::after {
            transform: scaleX(1);
        }

        .file-link {
            display: block;
            padding: 1.2rem;
            text-decoration: none;
            color: inherit;
        }

        .file-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            display: inline-block;
        }

        .file-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .file-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.65rem;
            color: #8A9BDF;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: #16213E;
            border-radius: 20px;
            color: #8A9BDF;
        }

        .footer {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.7rem;
            color: #5A6BA0;
        }

        .skeleton {
            background: linear-gradient(90deg, #16213E 25%, #1A2A4A 50%, #16213E 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
            height: 150px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0.75rem 1rem;
            }
            .nav-container {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-search {
                max-width: 100%;
                order: 3;
            }
            .logo {
                justify-content: space-between;
            }
            .nav-links {
                justify-content: flex-end;
            }
            .main-container {
                padding: 1rem;
            }
            .archive-title {
                font-size: 1.5rem;
            }
            .files-grid {
                grid-template-columns: 1fr;
            }
            .stat-card {
                min-width: 120px;
                padding: 0.8rem 1rem;
            }
            .stat-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-icon">🏗️</div>
            <span class="logo-text">Огни 3</span>
        </div>
        <div class="nav-search">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по архиву...">
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="resources.html" class="nav-link">Ресурсы</a>
            <a href="archive.html" class="nav-link" style="background: rgba(45,106,255,0.15); color: #2D6AFF;">Архив</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="archive-header">
        <h1 class="archive-title">📁 Архив экспортированных файлов</h1>
        <p class="archive-subtitle">Все сохранённые версии реестра трудовых ресурсов</p>
    </div>

    <div class="stats-row" id="statsContainer">
        <div class="stat-card">
            <div class="stat-number" id="totalFiles">—</div>
            <div class="stat-label">Всего файлов</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalSize">—</div>
            <div class="stat-label">Общий размер</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="lastUpdate">—</div>
            <div class="stat-label">Последнее обновление</div>
        </div>
    </div>

    <div id="filesContainer" class="files-grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>
</div>

<footer class="footer">
    Огни 3 · Архив экспортированных файлов · © 2026
</footer>

<script>
    const GITHUB_USERNAME = "buildingmove-source";
    const GITHUB_REPO = "BuildPhysics";

    function formatFileSize(bytes) {
        if (bytes === 0 || !bytes) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function formatDate(dateString) {
        if (!dateString) return '—';
        const date = new Date(dateString);
        return date.toLocaleDateString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });
    }

    // Загрузка файлов напрямую через список коммитов
    async function loadArchiveFiles() {
        const container = document.getElementById('filesContainer');
        const totalSpan = document.getElementById('totalFiles');
        const sizeSpan = document.getElementById('totalSize');
        const lastUpdateSpan = document.getElementById('lastUpdate');
        
        try {
            // Получаем список коммитов, чтобы найти файлы ресурсов
            const commitsResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits?per_page=100`);
            if (!commitsResponse.ok) throw new Error('Не удалось загрузить коммиты');
            const commits = await commitsResponse.json();
            
            // Собираем уникальные файлы ресурсов из коммитов
            const resourceFilesMap = new Map();
            
            for (const commit of commits) {
                // Получаем список файлов в коммите
                const commitDetailResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits/${commit.sha}`);
                if (commitDetailResponse.ok) {
                    const commitDetail = await commitDetailResponse.json();
                    const files = commitDetail.files || [];
                    
                    for (const file of files) {
                        const fileName = file.filename.split('/').pop();
                        if (fileName.startsWith('Ресурсы_Огни3_') && fileName.endsWith('.html')) {
                            if (!resourceFilesMap.has(fileName)) {
                                resourceFilesMap.set(fileName, {
                                    name: fileName,
                                    size: file.size || 0,
                                    date: commit.commit.committer.date,
                                    sha: commit.sha
                                });
                            }
                        }
                    }
                }
            }
            
            const resourceFiles = Array.from(resourceFilesMap.values());
            
            if (resourceFiles.length === 0) {
                container.innerHTML = `<div class="empty-state">📭 В архиве пока нет файлов. Экспортируйте данные из раздела "Ресурсы".</div>`;
                totalSpan.textContent = '0';
                sizeSpan.textContent = '0 KB';
                lastUpdateSpan.textContent = '—';
                return;
            }
            
            // Сортировка по дате (новые сверху)
            const sortedFiles = resourceFiles.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // Подсчёт статистики
            const totalFilesCount = sortedFiles.length;
            const totalBytes = sortedFiles.reduce((sum, file) => sum + (file.size || 0), 0);
            const lastFile = sortedFiles[0];
            const lastUpdateDate = lastFile?.date ? formatDate(lastFile.date) : '—';
            
            totalSpan.textContent = totalFilesCount;
            sizeSpan.textContent = formatFileSize(totalBytes);
            lastUpdateSpan.textContent = lastUpdateDate;
            
            // Отображаем файлы
            container.innerHTML = sortedFiles.map((file, index) => {
                const dateMatch = file.name.match(/(\d{4}-\d{2}-\d{2})/);
                let displayDate = dateMatch ? dateMatch[1].replace(/-/g, '.') : 'дата неизвестна';
                const fileSize = formatFileSize(file.size || 0);
                const fileUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${file.name}`;
                
                return `
                    <div class="file-card" style="animation: fadeInUp 0.3s ease ${index * 0.05}s forwards">
                        <a href="${fileUrl}" class="file-link" target="_blank" rel="noopener noreferrer">
                            <div class="file-icon">📊</div>
                            <div class="file-name">Экспорт ресурсов от ${displayDate}</div>
                            <div class="file-meta">
                                <span class="file-date">📅 ${formatDate(file.date)}</span>
                                <span class="file-size">💾 ${fileSize}</span>
                            </div>
                        </a>
                    </div>
                `;
            }).join('');
            
        } catch (error) {
            console.error('Ошибка загрузки архива:', error);
            container.innerHTML = `<div class="empty-state">❌ Ошибка загрузки архива. Попробуйте обновить страницу.</div>`;
            totalSpan.textContent = '0';
            sizeSpan.textContent = '0 KB';
            lastUpdateSpan.textContent = '—';
        }
    }

    // Поиск по файлам
    const searchInput = document.getElementById('searchInput');
    let debounceTimer;
    
    searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const searchTerm = e.target.value.toLowerCase();
        
        debounceTimer = setTimeout(async () => {
            const container = document.getElementById('filesContainer');
            
            if (!searchTerm) {
                loadArchiveFiles();
                return;
            }
            
            try {
                const commitsResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits?per_page=100`);
                if (!commitsResponse.ok) throw new Error('Ошибка загрузки');
                const commits = await commitsResponse.json();
                
                const resourceFilesMap = new Map();
                
                for (const commit of commits) {
                    const commitDetailResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits/${commit.sha}`);
                    if (commitDetailResponse.ok) {
                        const commitDetail = await commitDetailResponse.json();
                        const files = commitDetail.files || [];
                        
                        for (const file of files) {
                            const fileName = file.filename.split('/').pop();
                            if (fileName.startsWith('Ресурсы_Огни3_') && fileName.endsWith('.html') && fileName.toLowerCase().includes(searchTerm)) {
                                if (!resourceFilesMap.has(fileName)) {
                                    resourceFilesMap.set(fileName, {
                                        name: fileName,
                                        size: file.size || 0,
                                        date: commit.commit.committer.date
                                    });
                                }
                            }
                        }
                    }
                }
                
                const resourceFiles = Array.from(resourceFilesMap.values());
                
                if (resourceFiles.length === 0) {
                    container.innerHTML = `<div class="empty-state">🔍 Ничего не найдено по запросу "${e.target.value}"</div>`;
                    document.getElementById('totalFiles').textContent = '0';
                    return;
                }
                
                container.innerHTML = resourceFiles.map((file, index) => {
                    const dateMatch = file.name.match(/(\d{4}-\d{2}-\d{2})/);
                    let displayDate = dateMatch ? dateMatch[1].replace(/-/g, '.') : 'дата неизвестна';
                    const fileUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${file.name}`;
                    
                    return `
                        <div class="file-card" style="animation: fadeInUp 0.3s ease ${index * 0.05}s forwards">
                            <a href="${fileUrl}" class="file-link" target="_blank" rel="noopener noreferrer">
                                <div class="file-icon">📊</div>
                                <div class="file-name">Экспорт ресурсов от ${displayDate}</div>
                                <div class="file-meta">
                                    <span class="file-size">💾 ${formatFileSize(file.size || 0)}</span>
                                </div>
                            </a>
                        </div>
                    `;
                }).join('');
                
                document.getElementById('totalFiles').textContent = resourceFiles.length;
                
            } catch (error) {
                container.innerHTML = `<div class="empty-state">❌ Ошибка поиска</div>`;
            }
        }, 300);
    });
    
    loadArchiveFiles();
</script>
</body>
</html>
