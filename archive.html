<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#1A1A2E">
    <title>Архив ресурсов · Огни 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1A1A2E;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #EEEEEE;
            line-height: 1.5;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(22, 30, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.75rem 1.5rem;
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .logo-icon {
            background: linear-gradient(135deg, #2D6AFF, #00B4D8);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: all 0.3s;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #00B4D8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-search {
            flex: 1;
            max-width: 360px;
        }

        .nav-search input {
            width: 100%;
            padding: 0.7rem 1.2rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            color: white;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-search input:focus {
            outline: none;
            background: rgba(255,255,255,0.1);
            border-color: #2D6AFF;
        }

        .nav-search input::placeholder {
            color: #5A6BA0;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #8A9BDF;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(45, 106, 255, 0.15);
            color: #00B4D8;
        }

        .main-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .archive-header {
            margin-bottom: 2rem;
        }

        .archive-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #2D6AFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .archive-subtitle {
            color: #8A9BDF;
            font-size: 0.9rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: #16213E;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            flex: 1;
            min-width: 150px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #2D6AFF;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #8A9BDF;
            margin-top: 0.3rem;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .file-card {
            background: #16213E;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .file-card:hover {
            transform: translateY(-4px);
            border-color: #2D6AFF;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.5);
        }

        .file-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #2D6AFF, #00B4D8);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .file-card:hover::after {
            transform: scaleX(1);
        }

        .file-link {
            display: block;
            padding: 1.2rem;
            text-decoration: none;
            color: inherit;
        }

        .file-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            display: inline-block;
        }

        .file-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .file-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.65rem;
            color: #8A9BDF;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: #16213E;
            border-radius: 20px;
            color: #8A9BDF;
        }

        .footer {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.7rem;
            color: #5A6BA0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0.75rem 1rem;
            }
            .nav-container {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-search {
                max-width: 100%;
                order: 3;
            }
            .logo {
                justify-content: space-between;
            }
            .nav-links {
                justify-content: flex-end;
            }
            .main-container {
                padding: 1rem;
            }
            .archive-title {
                font-size: 1.5rem;
            }
            .files-grid {
                grid-template-columns: 1fr;
            }
            .stat-card {
                min-width: 120px;
                padding: 0.8rem 1rem;
            }
            .stat-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-icon">🏗️</div>
            <span class="logo-text">Огни 3</span>
        </div>
        <div class="nav-search">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по архиву...">
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="resources.html" class="nav-link">Ресурсы</a>
            <a href="archive.html" class="nav-link" style="background: rgba(45,106,255,0.15); color: #2D6AFF;">Архив</a>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="archive-header">
        <h1 class="archive-title">📁 Архив экспортированных файлов</h1>
        <p class="archive-subtitle">Все сохранённые версии реестра трудовых ресурсов</p>
    </div>

    <div class="stats-row" id="statsContainer">
        <div class="stat-card">
            <div class="stat-number" id="totalFiles">—</div>
            <div class="stat-label">Всего файлов</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalSize">—</div>
            <div class="stat-label">Общий размер</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="lastUpdate">—</div>
            <div class="stat-label">Последнее обновление</div>
        </div>
    </div>

    <div id="filesContainer" class="files-grid"></div>
</div>

<footer class="footer">
    Огни 3 · Архив экспортированных файлов · © 2026
</footer>

<script>
    const GITHUB_USERNAME = "buildingmove-source";
    const GITHUB_REPO = "BuildPhysics";
    const BASE_URL = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/`;

    // Постоянный список файлов, который обновляется вручную
    const MANUAL_FILE_LIST = [
        {
            name: "Ресурсы_Огни3_05-05-2026.html",
            date: "05.05.2026",
            size: 57000
        }
    ];

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function loadArchiveFiles() {
        const container = document.getElementById('filesContainer');
        const totalSpan = document.getElementById('totalFiles');
        const sizeSpan = document.getElementById('totalSize');
        const lastUpdateSpan = document.getElementById('lastUpdate');
        
        try {
            // Проверяем существование каждого файла
            const validFiles = [];
            
            for (const file of MANUAL_FILE_LIST) {
                const testUrl = BASE_URL + file.name;
                const response = await fetch(testUrl, { method: 'HEAD' });
                if (response.ok) {
                    validFiles.push(file);
                }
            }
            
            if (validFiles.length === 0) {
                container.innerHTML = `<div class="empty-state">📭 В архиве пока нет файлов. Экспортируйте данные из раздела "Ресурсы".</div>`;
                totalSpan.textContent = '0';
                sizeSpan.textContent = '0 KB';
                lastUpdateSpan.textContent = '—';
                return;
            }
            
            // Сортировка по дате
            const sortedFiles = validFiles.sort((a, b) => {
                const [dayA, monthA, yearA] = a.date.split('.');
                const [dayB, monthB, yearB] = b.date.split('.');
                const dateA = new Date(yearA, monthA - 1, dayA);
                const dateB = new Date(yearB, monthB - 1, dayB);
                return dateB - dateA;
            });
            
            const totalFilesCount = sortedFiles.length;
            const totalBytes = sortedFiles.reduce((sum, file) => sum + (file.size || 0), 0);
            const lastFile = sortedFiles[0];
            
            totalSpan.textContent = totalFilesCount;
            sizeSpan.textContent = formatFileSize(totalBytes);
            lastUpdateSpan.textContent = lastFile?.date || '—';
            
            container.innerHTML = sortedFiles.map((file, index) => {
                const fileUrl = BASE_URL + file.name;
                
                return `
                    <div class="file-card" style="animation: fadeInUp 0.3s ease ${index * 0.05}s forwards">
                        <a href="${fileUrl}" class="file-link" target="_blank" rel="noopener noreferrer">
                            <div class="file-icon">📊</div>
                            <div class="file-name">Экспорт ресурсов от ${file.date}</div>
                            <div class="file-meta">
                                <span class="file-date">📅 ${file.date}</span>
                                <span class="file-size">💾 ${formatFileSize(file.size)}</span>
                            </div>
                        </a>
                    </div>
                `;
            }).join('');
            
        } catch (error) {
            console.error('Ошибка загрузки архива:', error);
            container.innerHTML = `<div class="empty-state">❌ Ошибка загрузки архива. Проверьте подключение к интернету.</div>`;
        }
    }

    // Поиск по файлам
    const searchInput = document.getElementById('searchInput');
    let debounceTimer;
    
    searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const searchTerm = e.target.value.toLowerCase();
        
        debounceTimer = setTimeout(() => {
            const cards = document.querySelectorAll('.file-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const fileName = card.querySelector('.file-name')?.innerText.toLowerCase() || '';
                if (fileName.includes(searchTerm)) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            const totalSpan = document.getElementById('totalFiles');
            if (totalSpan && !isNaN(visibleCount)) {
                totalSpan.textContent = visibleCount;
            }
            
            const container = document.getElementById('filesContainer');
            const existingEmpty = container.querySelector('.search-empty');
            if (visibleCount === 0 && cards.length > 0) {
                if (!existingEmpty) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'empty-state search-empty';
                    emptyMsg.innerText = `🔍 Ничего не найдено по запросу "${e.target.value}"`;
                    container.appendChild(emptyMsg);
                }
            } else if (existingEmpty) {
                existingEmpty.remove();
            }
        }, 300);
    });
    
    loadArchiveFiles();
</script>
</body>
</html>
