<!-- button.html - общая кнопка для всех страниц -->
<style>
    .home-button-global {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #e31b23, #ff4d4d);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
        transition: all 0.3s ease;
        z-index: 1000;
        text-decoration: none;
        border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .home-button-global:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 25px rgba(227, 27, 35, 0.6);
    }

    .home-button-global:active {
        transform: scale(0.95);
    }

    /* Зелёный пульсирующий кружок */
    .home-button-global::after {
        content: '';
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        border-radius: 50%;
        background: rgba(46, 204, 113, 0.6);
        animation: pulseGreen 1.2s infinite;
        z-index: -1;
    }

    @keyframes pulseGreen {
        0% {
            transform: scale(1);
            opacity: 0.7;
        }
        100% {
            transform: scale(1.4);
            opacity: 0;
        }
    }

    .home-icon-global {
        font-size: 28px;
        color: white;
        transition: transform 0.3s ease;
    }

    .home-button-global:hover .home-icon-global {
        transform: translateY(-2px);
    }

    @media (max-width: 480px) {
        .home-button-global {
            width: 48px;
            height: 48px;
            bottom: 15px;
            right: 15px;
        }
        .home-icon-global {
            font-size: 24px;
        }
    }
</style>

<a href="https://buildingmove-source.github.io/BuildPhysics/" class="home-button-global" id="homeButtonGlobal">
    <span class="home-icon-global">🏠</span>
</a>
