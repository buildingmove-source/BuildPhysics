<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#F9FAFB">
    <meta name="description" content="Штаб строительства ЖК Огни 3 - спокойный командный центр">
    <title>Огни 3 | Командный центр</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-page: #F3F4F6;
            --bg-card: #FFFFFF;
            --bg-sidebar: #FFFFFF;
            --accent-blue: #3B82F6;
            --accent-cyan: #06B6D4;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-orange: #F97316;
            --accent-yellow: #F59E0B;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s ease;
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
        }

        body {
            background: var(--bg-page);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Свои скроллы */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

        /* Анимации */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); }
            70% { box-shadow: 0 0 0 8px rgba(59,130,246,0); }
            100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
        }

        /* ШАПКА */
        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.75rem 1.5rem;
        }
        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1F2937, var(--accent-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-search input {
            width: 100%;
            padding: 0.6rem 1rem;
            background: #F9FAFB;
            border: 1px solid var(--border-light);
            border-radius: 40px;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .nav-search input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .mobile-menu-btn {
            background: rgba(59,130,246,0.1);
            border: 1px solid var(--border-light);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        /* ОСНОВНАЯ СЕТКА */
        .main-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
        }
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 85px;
            height: fit-content;
        }
        .sidebar-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            transition: var(--transition);
            cursor: pointer;
            width: 100%;
            background: none;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .sidebar-item:hover {
            background: #F3F4F6;
            transform: translateX(4px);
        }
        .content {
            flex: 1;
            min-width: 0;
        }

        /* ПУЛЬС ПРОЕКТА */
        .pulse-card {
            background: linear-gradient(135deg, #FFFFFF, #F9FAFB);
            border-radius: var(--radius-lg);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .pulse-status {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .pulse-indicator {
            width: 48px;
            height: 48px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .pulse-indicator.calm { background: #D1FAE5; color: #10B981; }
        .pulse-indicator.warning { background: #FEF3C7; color: #F59E0B; }
        .pulse-indicator.critical { background: #FEE2E2; color: #EF4444; }
        .pulse-text h3 { font-size: 1.2rem; font-weight: 600; }
        .pulse-text p { font-size: 0.8rem; color: var(--text-secondary); }
        .pulse-metrics {
            display: flex;
            gap: 2rem;
        }
        .metric { text-align: center; }
        .metric-value { font-size: 1.5rem; font-weight: 700; }
        .metric-label { font-size: 0.7rem; color: var(--text-secondary); }

        /* ВИДЖЕТ "ЧТО ТРЕБУЕТ ВНИМАНИЯ?" */
        .attention-card {
            background: linear-gradient(135deg, #FFFFFF, #FEF2F2);
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            border: 1px solid #FEE2E2;
            overflow: hidden;
        }
        .attention-header {
            padding: 1rem 1.5rem;
            background: rgba(239,68,68,0.04);
            border-bottom: 1px solid #FEE2E2;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .attention-list {
            padding: 0.5rem 0;
        }
        .attention-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .attention-item:last-child { border-bottom: none; }
        .attention-info { flex: 1; }
        .attention-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
        .attention-deadline { font-size: 0.7rem; color: var(--accent-red); }
        .attention-action {
            background: #FEE2E2;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .attention-action:hover { background: #FECACA; }

        /* ДОРОЖНАЯ КАРТА */
        .roadmap-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-light);
        }
        .roadmap-header {
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }
        .roadmap-stages {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .stage {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            background: #F9FAFB;
            position: relative;
        }
        .stage-icon { font-size: 1.2rem; margin-bottom: 0.3rem; }
        .stage-name { font-size: 0.7rem; font-weight: 500; }
        .stage-status { font-size: 0.6rem; color: var(--text-secondary); margin-top: 0.2rem; }
        .stage.completed { background: #D1FAE5; }
        .stage.active { background: #DBEAFE; border: 1px solid var(--accent-blue); }
        .stage.pending { background: #F3F4F6; }

        /* ДОКУМЕНТЫ — КАРТОЧКИ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .section-title {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .docs-count {
            background: #E5E7EB;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        .doc-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            animation: fadeSlideUp 0.3s ease;
        }
        .doc-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-blue);
        }
        .card-link {
            display: block;
            padding: 1rem;
            text-decoration: none;
            color: inherit;
        }
        .doc-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin: 0.4rem 0;
        }
        .doc-risk {
            font-size: 0.7rem;
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            margin: 0.5rem 0;
            display: inline-block;
        }
        .risk-critical { background: #FEE2E2; color: #DC2626; border-left: 3px solid var(--accent-red); }
        .risk-warning { background: #FEF3C7; color: #D97706; border-left: 3px solid var(--accent-yellow); }
        .risk-normal { background: #D1FAE5; color: #059669; border-left: 3px solid var(--accent-green); }
        .doc-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.6rem;
            color: var(--text-secondary);
        }
        .next-step-btn {
            background: #F3F4F6;
            border-top: 1px solid var(--border-light);
            padding: 0.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--accent-blue);
            cursor: pointer;
            transition: var(--transition);
        }
        .next-step-btn:hover {
            background: #E5E7EB;
        }
        .empty-state {
            text-align: center;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
        }
        .footer {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.2rem;
            text-align: center;
            border-top: 1px solid var(--border-light);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* МОДАЛЬНЫЕ ОКНА (контакты, задача) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow: auto;
            padding: 1.5rem;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Прочее (чат, мобильное меню) */
        .chat-float-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            color: white;
            font-size: 1.5rem;
            z-index: 1500;
        }
        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 80%;
            max-width: 320px;
            height: 100%;
            background: white;
            z-index: 2100;
            transform: translateX(100%);
            transition: transform 0.3s;
            padding: 1rem;
        }
        .mobile-sidebar.open { transform: translateX(0); }
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
        }
        .backdrop.show { opacity: 1; visibility: visible; }

        @media (max-width: 800px) {
            .sidebar { display: none; }
            .mobile-menu-btn { display: flex; }
            .main-container { padding: 1rem; }
            .pulse-card { flex-direction: column; align-items: flex-start; }
            .roadmap-stages { flex-direction: column; }
            .stage { display: flex; align-items: center; gap: 1rem; justify-content: space-between; }
        }
    </style>
</head>

        { name: "Приемка ДРОН", status: "pending", icon: "✅" }
    ];

    // ПУЛЬС ПРОЕКТА
    function updatePulse() {
        const criticalCount = pages.filter(p => p.riskLevel === 'critical').length;
        const warningCount = pages.filter(p => p.riskLevel === 'warning').length;
        let statusType = 'calm', statusText = 'Всё под контролем', statusIcon = '😌';
        if (criticalCount > 0) { statusType = 'critical'; statusText = 'Требуется срочное внимание'; statusIcon = '⚠️'; }
        else if (warningCount > 0) { statusType = 'warning'; statusText = 'Есть риски, следим'; statusIcon = '🧐'; }
        const completedTasks = Math.floor(Math.random() * 30) + 60; // демо
        document.getElementById('pulseWidget').innerHTML = `
            <div class="pulse-status">
                <div class="pulse-indicator ${statusType}">${statusIcon}</div>
                <div class="pulse-text"><h3>${statusText}</h3><p>Общее состояние проекта</p></div>
            </div>
            <div class="pulse-metrics">
                <div class="metric"><div class="metric-value">${completedTasks}%</div><div class="metric-label">задач в срок</div></div>
                <div class="metric"><div class="metric-value">${criticalCount + warningCount}</div><div class="metric-label">активных рисков</div></div>
            </div>
        `;
    }

    // ВИДЖЕТ ВНИМАНИЯ
    function renderAttention() {
        const container = document.getElementById('attentionWidget');
        container.innerHTML = `
            <div class="attention-header">🔔 Что требует вашего внимания?</div>
            <div class="attention-list">
                ${topRisks.map(risk => `
                    <div class="attention-item">
                        <div class="attention-info">
                            <div class="attention-title">${escapeHtml(risk.title)}</div>
                            <div class="attention-deadline">📅 ${escapeHtml(risk.deadline)} | Ответственный: ${escapeHtml(risk.responsible)}</div>
                        </div>
                        <button class="attention-action" onclick="openContactsForAssign('${escapeHtml(risk.title)}')">${escapeHtml(risk.action)} →</button>
                    </div>
                `).join('')}
            </div>
            <div style="padding:0.7rem 1.5rem; font-size:0.7rem; background:#FEF2F2; border-top:1px solid #FEE2E2;">⚡ Всего активных проблем: ${topRisks.length}</div>
        `;
    }

    // ДОРОЖНАЯ КАРТА
    function renderRoadmap() {
        const container = document.getElementById('roadmapStages');
        container.innerHTML = stages.map(s => `
            <div class="stage ${s.status}">
                <div class="stage-icon">${s.icon}</div>
                <div class="stage-name">${s.name}</div>
                <div class="stage-status">${s.progress ? s.progress : (s.status === 'completed' ? '✅' : '⏳')}</div>
            </div>
        `).join('');
    }

    // ДОКУМЕНТЫ
    let currentFilter = 'all', currentSearch = '';
    function renderDocs() {
        let filtered = pages.filter(p => p.name.toLowerCase().includes(currentSearch.toLowerCase()));
        if (currentFilter !== 'all') filtered = filtered.filter(p => p.category === currentFilter);
        const container = document.getElementById('docsContainer');
        document.getElementById('docsCount').innerText = filtered.length;
        if (!filtered.length) { container.innerHTML = `<div class="empty-state">📭 Документы не найдены</div>`; return; }
        container.innerHTML = filtered.map(d => {
            const riskClass = d.riskLevel === 'critical' ? 'risk-critical' : (d.riskLevel === 'warning' ? 'risk-warning' : 'risk-normal');
            return `
            <div class="doc-card">
                <a href="${d.file}" class="card-link">
                    <div style="font-size:1.6rem;">${d.icon}</div>
                    <div class="doc-name">${escapeHtml(d.name)}</div>
                    <div class="doc-risk ${riskClass}">${escapeHtml(d.risk)}</div>
                    <div class="doc-meta">📅 ${d.date}</div>
                </a>
                <div class="next-step-btn" onclick="openTaskModal('${escapeHtml(d.name.split('·')[0])}', 'Следующий этап: ${escapeHtml(d.name)}')">➕ Создать следующую задачу</div>
            </div>`;
        }).join('');
    }

    // КОНТАКТЫ
    function renderContactsModal() {
        const container = document.getElementById('contactsList');
        let html = '';
        for (const [name, data] of Object.entries(CONTACTS)) {
            html += `<div style="padding:0.5rem 0; border-bottom:1px solid #E5E7EB;"><b>${name}</b> — ${data.company}<br>📞 ${data.phone || '—'} ✉️ ${data.email || '—'}</div>`;
        }
        container.innerHTML = html;
    }
    function openContactsModal() { document.getElementById('contactsModal').classList.add('show'); renderContactsModal(); }
    function closeContactsModal() { document.getElementById('contactsModal').classList.remove('show'); }
    function copyAllContacts() {
        let text = '';
        for (const [name, data] of Object.entries(CONTACTS)) text += `${name} | ${data.company} | ${data.phone} | ${data.email}\n`;
        navigator.clipboard.writeText(text);
        alert('Контакты скопированы');
    }

    // ЗАДАЧИ
    let pendingTaskTitle = '';
    function openTaskModal(obj, taskName) {
        document.getElementById('taskName').value = taskName;
        document.getElementById('taskObject').value = obj;
        const select = document.getElementById('taskResponsible');
        select.innerHTML = '<option>Выберите</option>';
        for (let name of Object.keys(CONTACTS)) select.innerHTML += `<option>${escapeHtml(name)}</option>`;
        document.getElementById('taskModal').classList.add('show');
    }
    function closeTaskModal() { document.getElementById('taskModal').classList.remove('show'); }

    window.openContactsForAssign = (taskTitle) => { pendingTaskTitle = taskTitle; openContactsModal(); };
    function assignTaskTo(person) { alert(`✅ Задача "${pendingTaskTitle}" назначена на ${person}`); closeContactsModal(); }

    // ОБЩИЕ ФУНКЦИИ
    function filterDocs(cat) { currentFilter = cat; renderDocs(); }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    function showToast(msg) { alert(msg); } // упрощённо

    // ЗАГРУЗКА ЭКСПОРТА
    async function loadExportedFiles() {
        const container = document.getElementById('exportedFilesList');
        try {
            const resp = await fetch('https://buildingmove-source.github.io/BuildPhysics/files-index.json', { cache: 'no-store' });
            if (!resp.ok) throw new Error();
            const idx = await resp.json();
            const files = idx.files || [];
            if (files.length === 0) { container.innerHTML = 'Нет файлов'; return; }
            container.innerHTML = files.map(f => `<div style="margin:4px 0;">📎 ${f.date || 'файл'}</div>`).join('');
        } catch(e) { container.innerHTML = 'Ошибка загрузки'; }
    }

    // МОБИЛЬНОЕ МЕНЮ
    const mobileBtn = document.getElementById('mobileMenuBtn'), mobileSide = document.getElementById('mobileSidebar'), backdrop = document.getElementById('mobileBackdrop');
    function openMobileSidebar() { mobileSide.classList.add('open'); backdrop.classList.add('show'); document.body.style.overflow = 'hidden'; }
    function closeMobileSidebar() { mobileSide.classList.remove('open'); backdrop.classList.remove('show'); document.body.style.overflow = ''; }
    mobileBtn?.addEventListener('click', openMobileSidebar);
    document.getElementById('closeMobileSidebar')?.addEventListener('click', closeMobileSidebar);
    backdrop?.addEventListener('click', closeMobileSidebar);
    document.getElementById('contactsSidebarBtn')?.addEventListener('click', openContactsModal);
    document.getElementById('chatFloatBtn')?.addEventListener('click', () => alert('Чат в разработке'));
    document.getElementById('copyAllBtn')?.addEventListener('click', copyAllContacts);
    document.getElementById('createTaskConfirm')?.addEventListener('click', () => { alert('✅ Задача создана'); closeTaskModal(); });

    const search = document.getElementById('globalSearch');
    let deb; search?.addEventListener('input', (e) => { clearTimeout(deb); deb = setTimeout(() => { currentSearch = e.target.value; renderDocs(); }, 280); });

    loadExportedFiles();
    updatePulse();
    renderAttention();
    renderRoadmap();
    renderDocs();
    window.assignTaskTo = assignTaskTo;
    window.openTaskModal = openTaskModal;
    window.closeTaskModal = closeTaskModal;
    window.closeContactsModal = closeContactsModal;
</script>
</body>
</html>
