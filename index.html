<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Навигация и Медиа</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 24px 28px 32px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #1e2a3e;
        }
        .sub {
            color: #4a627a;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        .nav-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 40px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 24px;
        }
        .nav-btn {
            background: #f1f5f9;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            color: #0f172a;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .nav-btn:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }
        .nav-btn:active {
            transform: translateY(1px);
        }
        .radio-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-top: 8px;
        }
        .radio-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #0c4e6e;
        }
        .radio-title span {
            font-size: 1.5rem;
        }
        .video-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        .status {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #2c6e9e;
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
        }
        hr {
            margin: 24px 0 8px;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
        .footer-note {
            font-size: 0.7rem;
            color: #5b6e8c;
            text-align: center;
            margin-top: 24px;
        }
        @media (max-width: 550px) {
            .card {
                padding: 16px;
            }
            .nav-btn {
                padding: 8px 20px;
                font-size: 1rem;
            }
        }
    </style>
    <!-- Подключаем hls.js для поддержки HLS (m3u8) в HTML5 video -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>
<div class="card">
    <h1>📋 Навигация по реестрам</h1>
    <div class="sub">Управление документами и онлайн-трансляция</div>

    <!-- Блок кнопок (ВИС-реестры / протоколы) -->
    <div class="nav-panel">
        <button class="nav-btn" id="registryBtn">📂 ВИС-реестры</button>
        <button class="nav-btn" id="protocolsBtn">📄 Протоколы</button>
    </div>

    <!-- Радио / видео плеер (на базе HLS) -->
    <div class="radio-section">
        <div class="radio-title">
            <span>📡</span> Онлайн-трансляция &nbsp;<span style="font-size:0.8rem;">РБК ТВ</span>
        </div>
        <div class="video-wrapper" id="videoContainer">
            <video id="hlsVideo" controls autoplay muted playsinline poster="https://www.rbc.by/sites/default/files/styles/970x546/public/2022-03/online-tv.jpg?itok=5gk7FG6M">
                Ваш браузер не поддерживает видео.
            </video>
        </div>
        <div id="playerStatus" class="status">⏳ Загрузка потока...</div>
        <div style="font-size: 0.75rem; margin-top: 8px; opacity: 0.7;">
            🎧 Поток: http://online.video.rbc.ru/online/rbctv_480p/index.m3u8
        </div>
    </div>
    <hr />
    <div class="footer-note">
        ⚡ При нажатии «ВИС-реестры» и «Протоколы» открываются соответствующие страницы (ссылки можно заменить под свои).
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. НАСТРОЙКА ОТКРЫТИЯ СТРАНИЦ ПО ТРЕБОВАНИЮ
    // --------------------------------------------------------------
    // Замените URL на реальные адреса ваших страниц
    const REGISTRY_URL = "https://example.com/vis-reestry";   // ← ВАШ URL для ВИС-реестров
    const PROTOCOLS_URL = "https://example.com/protocols";    // ← ВАШ URL для протоколов

    document.getElementById("registryBtn").addEventListener("click", () => {
        window.open(REGISTRY_URL, "_blank");  // или "_self" для открытия в текущей вкладке
    });

    document.getElementById("protocolsBtn").addEventListener("click", () => {
        window.open(PROTOCOLS_URL, "_blank");
    });

    // --------------------------------------------------------------
    // 2. ИНИЦИАЛИЗАЦИЯ HLS ПЛЕЕРА ДЛЯ .M3U8 (РАДИО / ВИДЕО)
    // --------------------------------------------------------------
    const video = document.getElementById("hlsVideo");
    const statusDiv = document.getElementById("playerStatus");
    const streamUrl = "http://online.video.rbc.ru/online/rbctv_480p/index.m3u8";

    // Автозапуск с учетом политик браузера: autoplay + muted сначала (пользователь может снять mute)
    // Так как это видео-трансляция, звук будет, если включить громкость.
    function initPlayer() {
        // Проверяем поддержку HLS нативным способом (Safari/macOS)
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            statusDiv.innerHTML = "✅ Воспроизведение (нативный HLS)";
            video.play().catch(e => {
                console.warn("Автовоспроизведение заблокировано:", e);
                statusDiv.innerHTML = "⚠️ Нажмите Play для запуска трансляции";
            });
        } 
        // Если браузер поддерживает hls.js (Chrome, Firefox, Edge и др.)
        else if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                autoStartLoad: true,
                startLevel: 0   // старт с лучшего качества
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                statusDiv.innerHTML = "✅ Поток загружен, попытка воспроизведения...";
                video.play().then(() => {
                    statusDiv.innerHTML = "🔴 Идёт трансляция (звук доступен)";
                }).catch(err => {
                    statusDiv.innerHTML = "🔇 Автовоспроизведение заблокировано. Нажмите ▶️";
                    console.log("Play error:", err);
                });
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    statusDiv.innerHTML = "❌ Ошибка потока. Проверьте ссылку.";
                    console.error("HLS fatal error:", data);
                } else {
                    statusDiv.innerHTML = "⚠️ Сбои потока, переподключение...";
                }
            });
        } 
        else {
            statusDiv.innerHTML = "❌ Ваш браузер не поддерживает HLS трансляции.";
        }
    }

    // Принудительно снимаем muted через 1 секунду, если видео уже играет (чтобы был звук)
    // Но только если пользователь уже взаимодействовал со страницей. Лучше дать контрол.
    video.addEventListener('canplay', () => {
        if (video.muted) {
            // По умолчанию muted стоит для автозапуска, но через паузу можно выключить?
            // Не выключаем автоматически, чтобы не нарушать политику. Пользователь сам нажмет громкость.
            // Просто показываем подсказку.
            if (statusDiv.innerText.includes("блокировано") === false) {
                statusDiv.innerHTML = "🎬 Трансляция готова (снимите значок 🔇 для звука)";
            }
        }
    });

    // Запускаем плеер
    initPlayer();

    // Доп. красивое: если кликнуть по странице — можно попробовать разблокировать autoplay, 
    // но лучше стандартный controls.
    document.body.addEventListener('click', function enableAudioOnce() {
        if (video.paused && video.src) {
            video.play().catch(e=>{});
        }
    }, { once: true });
</script>
</body>
</html>
