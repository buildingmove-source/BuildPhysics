<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Огни 3 | Штаб строительства</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            color: #eef2ff;
            padding: 2rem 1rem;
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            background: linear-gradient(135deg, #ffffff, #6b8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #8a9bdf;
            font-size: 1rem;
        }

        .badge-repo {
            display: inline-block;
            background: #1a2448;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            margin-top: 1rem;
            border: 1px solid #33416e;
        }

        .search-box {
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(10, 20, 45, 0.85);
            border: 1px solid #2a3a6e;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #e31b23;
            background: rgba(10, 20, 45, 0.95);
        }

        .search-input::placeholder {
            color: #6a7bb5;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 0;
        }

        .count {
            background: #e31b23;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        .doc-card {
            background: rgba(6, 12, 28, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 1.2rem;
            border: 1px solid rgba(227, 27, 35, 0.25);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .doc-card:hover {
            transform: translateY(-3px);
            border-color: #e31b23;
            background: rgba(10, 20, 45, 0.9);
            box-shadow: 0 15px 35px -12px rgba(0,0,0,0.5);
        }

        .card-link {
            display: block;
            padding: 1.2rem;
            text-decoration: none;
            color: inherit;
        }

        .doc-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .doc-name {
            font-weight: 700;
            font-size: 1rem;
            word-break: break-word;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .doc-name span {
            background: #e31b23;
            font-size: 0.65rem;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .doc-meta {
            font-size: 0.7rem;
            color: #8a9bdf;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .empty-message {
            text-align: center;
            padding: 3rem;
            background: rgba(6, 12, 28, 0.6);
            border-radius: 1.5rem;
            margin-top: 2rem;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #5a6ba0;
            border-top: 1px solid #1e2748;
            padding-top: 1.5rem;
        }

        .google-card {
            background: rgba(52, 168, 83, 0.1);
            border: 1px solid #34a853;
            border-radius: 1.2rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }
        
        .google-card:hover {
            background: rgba(52, 168, 83, 0.2);
            transform: translateY(-2px);
        }
        
        .google-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.2rem;
            text-decoration: none;
            color: inherit;
        }
        
        .google-icon {
            font-size: 2rem;
        }
        
        .google-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #eef2ff;
        }
        
        .google-subtitle {
            font-size: 0.7rem;
            color: #8a9bdf;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏗️ Огни 3</h1>
        <p>Штаб строительства · Протоколы · Реестры · Документация</p>
        <div class="badge-repo">📁 Огни 3 · Информация</div>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Фильтр документов по названию... (например: протокол, огни, реестр)">
    </div>

    <div class="stats">
        <div>📄 Всего документов: <span id="totalCount" class="count">0</span></div>
    </div>

    <!-- Ссылка на Google Таблицу (ВИС Огни 3) -->
    <div class="google-card">
        <a href="VIS-Ogni-3.html" class="google-link">
            <div class="google-icon">📊</div>
            <div>
                <div class="google-title">ВИС Огни 3</div>
                <div class="google-subtitle">Google Таблица · Открыть →</div>
            </div>
        </a>
    </div>

    <div id="docsContainer" class="docs-grid">
        <div class="empty-message">⏳ Загрузка списка страниц...</div>
    </div>

    <div class="footer">
        Огни 3 
    </div>
</div>

<script>
    const GITHUB_USERNAME = "buildingmove-source";
    const REPO_NAME = "BuildPhysics";
    const BRANCH = "main";

    const searchInput = document.getElementById('searchInput');
    const docsContainer = document.getElementById('docsContainer');
    const totalSpan = document.getElementById('totalCount');

    let allHtmlFiles = [];

    // ===== СЛОВАРЬ ПЕРЕИМЕНОВАНИЙ (добавляйте новые файлы сюда) =====
    const renameMap = {
        "VIS-Ogni-3.html": "ВИС Огни 3",
        "PCP COP.html": "РСР СОРТ",
        "Сводка оплат.html": "Сводка оплат",
        "реестр для ЧЛ.html": "Реестр для ЧЛ",
        "протокол 28.04.2026.html": "Протокол 28.04.2026",
        "протокол 47 от 29.04.2026.html": "Протокол 47 от 29.04.2026",
        "протокол_46_огни_3_от_22_04_2026.html": "Протокол №46 · Огни 3"
    };

    function getDisplayName(filename) {
        if (renameMap[filename]) {
            return renameMap[filename];
        }
        return filename.replace(/\.html$/i, '');
    }

    async function fetchHtmlFiles() {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error(`Ошибка API: ${response.status}`);
            }
            const data = await response.json();
            
            const htmlFiles = data.tree.filter(item => 
                item.type === 'blob' && 
                item.path.toLowerCase().endsWith('.html')
            );
            
            return htmlFiles.map(file => ({
                name: file.path.split('/').pop(),
                fullPath: file.path,
                url: `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${encodeURIComponent(file.path)}`
            })).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
            
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            return null;
        }
    }

    function renderDocs(filterText = '') {
        const lowerFilter = filterText.toLowerCase();
        
        // Исключаем VIS-Ogni-3.html из автоматического списка, так как уже добавили отдельной карточкой
        const filtered = allHtmlFiles.filter(file => {
            if (file.name === 'VIS-Ogni-3.html') return false;
            const displayName = getDisplayName(file.name);
            return displayName.toLowerCase().includes(lowerFilter) || 
                   file.name.toLowerCase().includes(lowerFilter);
        });
        
        totalSpan.textContent = filtered.length;
        
        if (filtered.length === 0) {
            docsContainer.innerHTML = `<div class="empty-message">📭 Ничего не найдено</div>`;
            return;
        }
        
        docsContainer.innerHTML = filtered.map(file => {
            let icon = "📄";
            const displayName = getDisplayName(file.name);
            const lowerName = displayName.toLowerCase();
            
            if (lowerName.includes('протокол')) icon = "📋";
            else if (lowerName.includes('реестр')) icon = "📊";
            else if (lowerName.includes('распределительная')) icon = "📑";
            else if (lowerName.includes('сводка')) icon = "₽";
            else if (lowerName.includes('огни')) icon = "🔥";
            else if (lowerName.includes('рср')) icon = "💼";
            
            return `
                <div class="doc-card">
                    <a href="${file.url}" class="card-link" target="_blank" rel="noopener noreferrer">
                        <div class="doc-icon">${icon}</div>
                        <div class="doc-name">
                            ${escapeHtml(displayName)}
                            <span>HTML</span>
                        </div>
                        <div class="doc-meta">
                            <span>📂 ${escapeHtml(file.fullPath)}</span>
                            <span>🔗 Открыть →</span>
                        </div>
                    </a>
                </div>
            `;
        }).join('');
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function init() {
        docsContainer.innerHTML = '<div class="empty-message">⏳ Загрузка списка страниц...</div>';
        
        const files = await fetchHtmlFiles();
        if (!files || files.length === 0) {
            docsContainer.innerHTML = `<div class="empty-message">❌ Не удалось загрузить список файлов</div>`;
            totalSpan.textContent = '0';
            return;
        }
        
        allHtmlFiles = files.filter(f => f.name !== 'index.html');
        
        if (allHtmlFiles.length === 0) {
            docsContainer.innerHTML = `<div class="empty-message">✨ Нет других страниц</div>`;
            totalSpan.textContent = '0';
            return;
        }
        
        renderDocs();
        
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                renderDocs(e.target.value);
            }, 250);
        });
    }
    
    init();
</script>
</body>
</html>
