<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Чат · Огни 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1A1A2E; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #16213E; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .back-btn { background: rgba(255,255,255,0.08); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .back-btn:hover { background: #E94560; }
        .chat-title h1 { font-size: 1.2rem; font-weight: 600; }
        .chat-title span { font-size: 0.7rem; color: #34a853; }
        .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { display: flex; gap: 0.8rem; max-width: 70%; }
        .message.outgoing { align-self: flex-end; flex-direction: row-reverse; }
        .message-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #E94560, #533483); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
        .message-bubble { background: #16213E; padding: 0.6rem 1rem; border-radius: 18px; border-top-left-radius: 4px; }
        .message.outgoing .message-bubble { background: #E94560; border-top-right-radius: 4px; border-top-left-radius: 18px; }
        .message-text { font-size: 0.85rem; line-height: 1.4; }
        .message-time { font-size: 0.6rem; color: #8A9BDF; margin-top: 0.2rem; text-align: right; }
        .input-area { padding: 1rem; background: #16213E; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 0.8rem; align-items: center; }
        .message-input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 0.7rem 1rem; color: white; font-size: 0.85rem; font-family: inherit; resize: none; }
        .send-btn { background: #E94560; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
        .clear-btn { background: rgba(255,255,255,0.08); border: none; color: #8A9BDF; padding: 0.5rem 1rem; border-radius: 40px; cursor: pointer; font-size: 0.8rem; }
        .clear-btn:hover { background: rgba(233,69,96,0.2); color: #E94560; }
        @media (max-width: 768px) { .message { max-width: 85%; } .chat-header { padding: 0.5rem 1rem; } }
    </style>
</head>
<body>
    <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <div class="chat-title">
            <h1>Чат · Огни 3</h1>
            <span>● История сообщений сохраняется навсегда</span>
        </div>
        <div style="flex:1"></div>
        <button class="clear-btn" onclick="clearChat()">🗑 Очистить историю</button>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="input-area">
        <textarea class="message-input" id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()">📤</button>
    </div>

    <script>
        const STORAGE_KEY = 'ogni3_chat_messages';
        
        function loadMessages() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            return messages;
        }

        function addMessage(text, isOutgoing = true) {
            const messages = loadMessages();
            messages.push({
                id: Date.now(),
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' }),
                date: new Date().toISOString(),
                isOutgoing: isOutgoing
            });
            saveMessages(messages);
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const messages = loadMessages();
            if (messages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#8A9BDF; padding:2rem;">✨ Нет сообщений. Напишите первое сообщение команде!</div>';
                return;
            }
            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.isOutgoing ? 'outgoing' : ''}">
                    <div class="message-avatar">${msg.isOutgoing ? '👤' : '🏗️'}</div>
                    <div class="message-bubble">
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${msg.time}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, true);
            input.value = '';
            input.style.height = 'auto';
        }

        function clearChat() {
            if (confirm('⚠️ Вы уверены? Вся история переписки будет удалена без возможности восстановления.')) {
                localStorage.removeItem(STORAGE_KEY);
                renderMessages();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        renderMessages();
    </script>
</body>
</html>
