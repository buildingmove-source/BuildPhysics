<html lang="ru">
<head>

    <!-- Цвет темы для браузера -->
    <meta name="theme-color" content="#FFD700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Огни 3">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            color: #eef2ff;
            padding: 2rem 1rem;
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #FFD700;
            font-size: 1rem;
        }

        .badge-repo {
            display: inline-block;
            background: #1a2448;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            margin-top: 1rem;
            border: 1px solid #FFD700;
            color: #FFD700;
        }

        .search-box {
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(10, 20, 45, 0.85);
            border: 1px solid #FFD700;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #FFA500;
            background: rgba(10, 20, 45, 0.95);
        }

        .search-input::placeholder {
            color: #FFD700;
            opacity: 0.6;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 0;
        }

        .count {
            background: #FFD700;
            color: #000000;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.2rem;
        }

        .doc-card {
            background: rgba(6, 12, 28, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 1.2rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: fadeInUp 0.5s ease-out;
        }

        .doc-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #FFD700;
            background: rgba(10, 20, 45, 0.95);
            box-shadow: 0 20px 40px -12px rgba(255, 215, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .doc-card:hover .doc-icon {
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .card-link {
            display: block;
            padding: 1.2rem;
            text-decoration: none;
            color: inherit;
        }

        .doc-icon {
            font-size: 2.2rem;
            margin-bottom: 0.7rem;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .doc-name {
            font-weight: 700;
            font-size: 1rem;
            word-break: break-word;
            color: #ffffff;
            margin-bottom: 0.4rem;
            line-height: 1.4;
        }

        .doc-meta {
            font-size: 0.7rem;
            color: #FFD700;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .empty-message {
            text-align: center;
            padding: 3rem;
            background: rgba(6, 12, 28, 0.6);
            border-radius: 1.5rem;
            margin-top: 2rem;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #FFD700;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 1.5rem;
        }

        .google-card {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            border-radius: 1.2rem;
            margin-bottom: 1.8rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .google-card:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -8px rgba(255, 215, 0, 0.3);
        }
        
        .google-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.2rem;
            text-decoration: none;
            color: inherit;
        }
        
        .google-icon {
            font-size: 2rem;
            transition: transform 0.3s ease;
        }
        
        .google-card:hover .google-icon {
            transform: scale(1.1);
        }
        
        .google-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #FFD700;
        }
        
        .google-subtitle {
            font-size: 0.7rem;
            color: #8a9bdf;
        }

        /* Кнопка с рупором */
        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            border: 2px solid #000000;
        }

        .home-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.7);
            background: #FFC107;
        }

        .home-button:active {
            transform: scale(0.95);
        }

        /* Пульсация */
        .home-button::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background: #FFD700;
            animation: pulseYellow 1.5s infinite;
            z-index: -1;
            opacity: 0.4;
        }

        @keyframes pulseYellow {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .home-icon {
            font-size: 28px;
            color: #000000;
            transition: transform 0.3s ease;
        }

        .home-button:hover .home-icon {
            transform: rotate(-5deg) scale(1.1);
        }

        @media (max-width: 480px) {
            .home-button {
                width: 48px;
                height: 48px;
                bottom: 15px;
                right: 15px;
            }
            .home-icon {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📢 Огни 3</h1>
        <p>Штаб строительства · Протоколы · Реестры · Документация</p>
        <div class="badge-repo">📢 Огни 3 · Актуальная информация</div>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Фильтр документов по названию...">
    </div>

    <div class="stats">
        <div>📄 Всего документов: <span id="totalCount" class="count">0</span></div>
        <div>📢 Строительная документация</div>
    </div>

    <!-- Google Таблица ВИС Огни 3 -->
    <div class="google-card">
        <a href="VIS-Ogni-3.html" class="google-link">
            <div class="google-icon">📊</div>
            <div>
                <div class="google-title">ВИС Огни 3</div>
                <div class="google-subtitle">Google Таблица · Открыть →</div>
            </div>
        </a>
    </div>

    <div id="docsContainer" class="docs-grid">
        <div class="empty-message">⏳ Загрузка списка...</div>
    </div>

    <div class="footer">
        📢 Огни 3 · Штаб строительства
    </div>
</div>

<script>
    // РУЧНОЙ СПИСОК ВСЕХ СТРАНИЦ
    const pages = [
        {
            name: "Протокол №46 · 22 апреля 2026 · 09:30",
            file: "протокол_46_огни_3_от_22_04_2026.html",
            icon: "📋"
        },
        {
            name: "Протокол №1 · 28 апреля 2026 · 12:30",
            file: "протокол 28.04.2026.html",
            icon: "📋"
        },
        {
            name: "Протокол №47 · 29 апреля 2026 · 09:30",
            file: "протокол 47 от 29.04.2026.html",
            icon: "📋"
        },
        {
            name: "РСР Реестр отделочных работ",
            file: "PCP COP.html",
            icon: "🪚"
        },
        {
            name: "Сводка оплат",
            file: "Сводка оплат.html",
            icon: "💰"
        },
        {
            name: "Реестр для чек-листа ИНЭКО",
            file: "реестр для ЧЛ.html",
            icon: "🔧"
        }
    ];

    const searchInput = document.getElementById('searchInput');
    const docsContainer = document.getElementById('docsContainer');
    const totalSpan = document.getElementById('totalCount');

    function renderDocs(filterText = '') {
        const lowerFilter = filterText.toLowerCase();
        const filtered = pages.filter(page => 
            page.name.toLowerCase().includes(lowerFilter)
        );
        
        totalSpan.textContent = filtered.length;
        
        if (filtered.length === 0) {
            docsContainer.innerHTML = `<div class="empty-message">📭 Ничего не найдено. Попробуйте другой запрос.</div>`;
            return;
        }
        
        docsContainer.innerHTML = filtered.map((page, index) => `
            <div class="doc-card" style="animation-delay: ${index * 0.05}s">
                <a href="${page.file}" class="card-link" rel="noopener noreferrer">
                    <div class="doc-icon">${page.icon}</div>
                    <div class="doc-name">
                        ${escapeHtml(page.name)}
                    </div>
                    <div class="doc-meta">
                        <span>📁 ${escapeHtml(page.file.replace(/\.html$/i, ''))}</span>
                        <span>🔗 Открыть →</span>
                    </div>
                </a>
            </div>
        `).join('');
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    renderDocs();
    
    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            renderDocs(e.target.value);
        }, 200);
    });
</script>
</body>
</html>
