<!-- Плавающее окно чата (popup) -->
<style>
    .chat-popup {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 380px;
        height: 500px;
        background: #16213E;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        z-index: 2000;
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(233,69,96,0.3);
        animation: slideUp 0.3s ease;
    }
    
    .chat-popup.show {
        display: flex;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .popup-header {
        background: #0F0F1A;
        padding: 0.8rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
    }
    
    .popup-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
    }
    
    .close-popup {
        background: none;
        border: none;
        color: #8A9BDF;
        font-size: 1.2rem;
        cursor: pointer;
        width: 30px;
        height: 30px;
        border-radius: 50%;
    }
    
    .close-popup:hover {
        background: rgba(233,69,96,0.2);
        color: #E94560;
    }
    
    .popup-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
    }
    
    .popup-message {
        display: flex;
        gap: 0.5rem;
        max-width: 85%;
    }
    
    .popup-message.outgoing {
        align-self: flex-end;
        flex-direction: row-reverse;
    }
    
    .popup-bubble {
        background: #0F0F1A;
        padding: 0.5rem 0.8rem;
        border-radius: 16px;
        border-top-left-radius: 4px;
        font-size: 0.8rem;
    }
    
    .popup-message.outgoing .popup-bubble {
        background: #E94560;
        border-top-right-radius: 4px;
        border-top-left-radius: 16px;
    }
    
    .popup-input-area {
        padding: 0.8rem;
        background: #0F0F1A;
        display: flex;
        gap: 0.5rem;
    }
    
    .popup-input {
        flex: 1;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        padding: 0.5rem 0.8rem;
        color: white;
        font-size: 0.8rem;
    }
    
    .popup-send {
        background: #E94560;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
    }
    
    @media (max-width: 480px) {
        .chat-popup {
            width: calc(100% - 20px);
            right: 10px;
            left: 10px;
            bottom: 10px;
            height: 70vh;
        }
    }
</style>

<div id="chatPopup" class="chat-popup">
    <div class="popup-header" onclick="toggleChatPopup()">
        <div class="popup-title">
            <span>💬</span>
            <span>Чат · Огни 3</span>
            <span style="background: #34a853; width: 8px; height: 8px; border-radius: 50%;"></span>
        </div>
        <button class="close-popup" onclick="event.stopPropagation(); closeChatPopup()">✕</button>
    </div>
    <div class="popup-messages" id="popupMessages">
        <div class="popup-message">
            <div class="popup-bubble">Доброе утро, коллеги!</div>
        </div>
        <div class="popup-message outgoing">
            <div class="popup-bubble">Здравствуйте!</div>
        </div>
    </div>
    <div class="popup-input-area">
        <input type="text" class="popup-input" id="popupMessageInput" placeholder="Напишите сообщение...">
        <button class="popup-send" onclick="sendPopupMessage()">📤</button>
    </div>
</div>

<script>
    function openChatPopup() {
        const popup = document.getElementById('chatPopup');
        popup.classList.add('show');
    }
    
    function closeChatPopup() {
        const popup = document.getElementById('chatPopup');
        popup.classList.remove('show');
    }
    
    function toggleChatPopup() {
        const popup = document.getElementById('chatPopup');
        if (popup.classList.contains('show')) {
            popup.classList.remove('show');
        } else {
            popup.classList.add('show');
        }
    }
    
    function sendPopupMessage() {
        const input = document.getElementById('popupMessageInput');
        const text = input.value.trim();
        if (!text) return;
        
        const container = document.getElementById('popupMessages');
        const now = new Date();
        const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        
        const messageDiv = document.createElement('div');
        messageDiv.className = 'popup-message outgoing';
        messageDiv.innerHTML = `<div class="popup-bubble">${escapeHtml(text)}<div style="font-size:0.55rem; opacity:0.7; margin-top:0.2rem;">${time}</div></div>`;
        container.appendChild(messageDiv);
        
        input.value = '';
        container.scrollTop = container.scrollHeight;
        
        // Имитация ответа
        setTimeout(() => {
            const replyDiv = document.createElement('div');
            replyDiv.className = 'popup-message';
            replyDiv.innerHTML = `<div class="popup-bubble">Принято! ✅<div style="font-size:0.55rem; opacity:0.7; margin-top:0.2rem;">${time}</div></div>`;
            container.appendChild(replyDiv);
            container.scrollTop = container.scrollHeight;
        }, 1000);
    }
    
    document.getElementById('popupMessageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendPopupMessage();
        }
    });
</script>
