        }

        .container {

            margin: 0 auto;
        }

            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-radius: 8px 8px 0 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .logo-icon {
            background: #2C6B2F;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2C3E50;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2C3E50;
        }

        .date-badge {
            background: #E8EDF2;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: monospace;
        }

        .back-btn {
            background: #2C6B2F;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .back-btn:hover { background: #1E4A21; }

        /* Панель управления */
        .admin-panel {
            background: white;
            border: 1px solid #D0D7DE;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-badge {
            background: #E8EDF2;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #2C6B2F;
        }

        .info-text {
            font-size: 0.7rem;
            color: #6c7a89;
            margin-left: 0.5rem;
        }

        .btn {
            border: none;
            padding: 0.45rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-save { background: #2C6B2F; color: white; }
        .btn-save:hover { background: #1E4A21; }
        .btn-pdf { background: #D32F2F; color: white; }
        .btn-pdf:hover { background: #B71C1C; }
        .btn-reset { background: #F5F5F5; color: #5A6E7A; border: 1px solid #D0D7DE; }
        .btn-reset:hover { background: #EEEEEE; }

        /* Таблица */
        .table-wrapper {
            background: white;
            border: 1px solid #D0D7DE;
            border-radius: 8px;
            overflow: auto;
            max-height: calc(100vh - 250px);
        }

        .resources-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 900px;
        }

        /* Фиксированная шапка */
        .resources-table thead tr {
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .resources-table th {
            background: #2C3E50;
            color: white;
            padding: 0.8rem;
            text-align: left;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #2C6B2F;
        }

        .resources-table td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #E8EDF2;
            vertical-align: top;
            background: white;
        }

        .resources-table tr:hover td {
            background: #F8FAFC;
        }

        /* Секционные заголовки */
        .section-header td {
            background: #E8EDF2;
            font-weight: 700;
            font-size: 14px;
            color: #2C3E50;
        }

        /* Подрядчики */
        .contractors-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .contractor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.2rem 0.3rem;
            background: #F8FAFC;
            border-radius: 4px;
        }

        .contractor-name {
            flex: 1;
            font-size: 12px;
            color: #2C6B2F;
            cursor: pointer;
            padding: 0.2rem;
        }

        .contractor-name:hover {
            background: #E8EDF2;
            border-radius: 3px;
        }

        .contractor-people {
            background: white;
            border: 1px solid #D0D7DE;
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            min-width: 55px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
        }

        .contractor-people:hover {
            background: #2C6B2F;
            color: white;
            border-color: #2C6B2F;
        }

        .contractor-people input {
            width: 55px;
            background: white;
            border: 1px solid #2C6B2F;
            border-radius: 3px;
            padding: 0.2rem;
            text-align: center;
            font-size: 12px;
        }

        .add-contractor-btn {
            background: rgba(44, 107, 47, 0.08);
            border: 1px dashed #2C6B2F;
            border-radius: 4px;
            padding: 0.25rem;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            color: #2C6B2F;
        }

        .add-contractor-btn:hover {
            background: rgba(44, 107, 47, 0.15);
        }

        .remove-contractor {
            background: none;
            border: none;
            color: #D32F2F;
            cursor: pointer;
            font-size: 14px;
            padding: 0 0.2rem;
        }

        .remove-contractor:hover {
            background: rgba(211, 47, 47, 0.1);
            border-radius: 3px;
        }

        .total-people-cell {
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            background: #F0F7F0;
        }

        .grand-total td {
            background: #2C6B2F;
            color: white;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            margin-top: 1rem;
            padding: 0.8rem;
            font-size: 0.7rem;
            color: #8A9DA8;
        }

        /* Кнопка домой */
        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #e31b23, #ff4d4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
            z-index: 1000;
            text-decoration: none;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }

        .home-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(227, 27, 35, 0.6);
        }

        .home-button::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.5);
            animation: pulseGreen 1.2s infinite;
            z-index: -1;
        }

        @keyframes pulseGreen {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .home-icon {
            font-size: 26px;
            color: white;
        }

        @media (max-width: 768px) {
            .home-button { width: 44px; height: 44px; }
            .home-icon { font-size: 22px; }
            .header { flex-direction: column; text-align: center; }
            .admin-panel { flex-direction: column; align-items: stretch; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2C3E50;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            z-index: 2000;
            transition: transform 0.2s;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Анимации перехода */
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-16px); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .page-fade-out { animation: fadeOut 0.3s ease-out forwards; }
        .page-fade-in { animation: fadeIn 0.3s ease-out forwards; }

            @page {
                size: A4;
                margin: 20mm 15mm 20mm 25mm;
            }

            body { background: white; padding: 0; margin: 0; }

                border-bottom: 1px solid black;

                background: #F0F0F0;
            }

                background: #E8EDF2;
                color: black;
            }

                position: fixed;
                left: 10mm;
                top: 50%;
                transform: translateY(-50%) rotate(-90deg);
                transform-origin: left center;
                font-size: 8px;
                font-family: monospace;
                white-space: nowrap;
                border: 1px solid black;
                padding: 4px 8px;
                background: white;
                z-index: 100;
            }

            /* Правый горизонтальный штамп */
            .gost-stamp-right {
                position: fixed;
                bottom: 15mm;
                right: 15mm;
                font-size: 7px;
                font-family: monospace;
                border-top: 1px solid black;
                padding-top: 3px;
                text-align: right;
                width: auto;
                background: white;
            }

            .gost-stamp-left::before {
                content: "АО «Огни 3» | ВИС | Трудовые ресурсы | Лист ";

    </style>
</head>

    const STORAGE_KEY = 'ogni3_resources_final';
    let resourcesData = [];

    function formatDate() {
        const now = new Date();
        return `${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    document.getElementById('dateBadge').textContent = `Дата: ${formatDate()}`;

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) resourcesData = JSON.parse(saved);
        else resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('Данные сохранены');
    }

    function resetData() {
        if (confirm('Сбросить все изменения?')) {
            resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
            renderTable();
            saveData();
            showToast('Сброшено к исходным');
        }
    }

    function getRowTotal(contractors) {
        return contractors.reduce((sum, c) => sum + (c.people || 0), 0);
    }

    function getTotalPeople() {
        return resourcesData.reduce((sum, item) => sum + getRowTotal(item.contractors), 0);
    }

    function editContractor(rowIndex, contractorIndex, element) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        const currentValue = contractor.people;
        
        const input = document.createElement('input');
        input.type = 'number';
        input.value = currentValue;
        input.min = 0;
        input.max = 999;
        input.step = 1;
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        input.select();
        
        const saveEdit = () => {
            let newValue = parseInt(input.value, 10);
            if (isNaN(newValue)) newValue = 0;
            if (newValue < 0) newValue = 0;
            if (newValue > 999) newValue = 999;
            contractor.people = newValue;
            renderTable();
            showToast(`${contractor.name}: ${newValue} чел.`);
        };
        
        const changeHandler = () => saveEdit();
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.stopPropagation();
            }
        });
    }

    function addContractor(rowIndex) {
        if (resourcesData[rowIndex].contractors.length >= 3) {
            showToast('Максимум 3 подрядчика');
            return;
        }
        resourcesData[rowIndex].contractors.push({ name: 'Новый подрядчик', people: 0 });
        renderTable();
        showToast('Добавлен подрядчик');
    }

    function removeContractor(rowIndex, contractorIndex) {
        if (resourcesData[rowIndex].contractors.length === 1) {
            resourcesData[rowIndex].contractors[0] = { name: '—', people: 0 };
            renderTable();
            showToast('Подрядчик очищен');
        } else {
            resourcesData[rowIndex].contractors.splice(contractorIndex, 1);
            renderTable();
            showToast('Подрядчик удалён');
        }
    }

    function editContractorName(rowIndex, contractorIndex, element) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        const input = document.createElement('input');
        input.type = 'text';
        input.value = contractor.name === '—' ? '' : contractor.name;
        input.style.width = '100%';
        input.style.background = 'white';
        input.style.border = '1px solid #2C6B2F';
        input.style.borderRadius = '3px';
        input.style.padding = '0.2rem';
        input.style.fontSize = '11px';
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newName = input.value.trim();
            if (newName === '') newName = '—';
            contractor.name = newName;
            container.innerHTML = escapeHtml(newName);
            showToast('Название изменено');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let currentSection = '';
        
        resourcesData.forEach((item, rowIndex) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="5"><strong>${item.section}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            
            const contractorsHtml = `<div class="contractors-list">${item.contractors.map((contractor, cIndex) => `
                <div class="contractor-item">
                    <span class="contractor-name" onclick="editContractorName(${rowIndex}, ${cIndex}, this)">${escapeHtml(contractor.name)}</span>
                    <span class="contractor-people" onclick="editContractor(${rowIndex}, ${cIndex}, this)">${contractor.people}</span>
                    <button class="remove-contractor" onclick="event.stopPropagation(); removeContractor(${rowIndex}, ${cIndex})">×</button>
                </div>
            `).join('')}${item.contractors.length < 3 ? `<div class="add-contractor-btn" onclick="addContractor(${rowIndex})">+ Добавить подрядчика</div>` : ''}</div>`;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${escapeHtml(item.section)}</td>
                <td>${escapeHtml(item.subsys)}</td>
                <td>${escapeHtml(item.work)}</td>
                <td>${contractorsHtml}</td>
                <td class="total-people-cell">${getRowTotal(item.contractors)}</td>
            `;
            tbody.appendChild(row);
        });
        
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        totalRow.innerHTML = `<td colspan="4"><strong>ВСЕГО ЧЕЛОВЕК</strong></td><td class="total-people-cell" style="text-align: center;"><strong>${getTotalPeople()}</strong></td>`;
        tbody.appendChild(totalRow);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    function navigateWithAnimation(url) {
        document.getElementById('pageContainer').classList.add('page-fade-out');
        setTimeout(() => window.location.href = url, 300);
    }
    
    function exportToPDF() {
        showToast('Подготовка PDF...');
        setTimeout(() => window.print(), 200);
    }
    
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('pdfBtn').addEventListener('click', exportToPDF);
    document.getElementById('backBtn').addEventListener('click', () => navigateWithAnimation('index.html'));
    document.getElementById('backLogo').addEventListener('click', () => navigateWithAnimation('index.html'));
    
    document.getElementById('pageContainer').classList.add('page-fade-in');
    loadData();
</script>
