        }

            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;

        }

        .logo {

            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .logo-icon {
            background: #2C6B2F;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2C3E50;
        }

        .title {

            font-weight: 500;
            color: #2C3E50;
        }

        .date-badge {
            background: #E8EDF2;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: monospace;
        }

        .back-btn {
            background: #2C6B2F;

            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .back-btn:hover { background: #1E4A21; }

            background: white;
            border: 1px solid #D0D7DE;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .admin-badge {
            background: #E8EDF2;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #2C6B2F;
        }

        .btn {
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-save { background: #2C6B2F; color: white; }
        .btn-save:hover { background: #1E4A21; }
        .btn-pdf { background: #D32F2F; color: white; }
        .btn-pdf:hover { background: #B71C1C; }
        .btn-reset { background: #F5F5F5; color: #5A6E7A; border: 1px solid #D0D7DE; }
        .btn-reset:hover { background: #EEEEEE; }

        /* Таблица */
        .table-wrapper {
            background: white;
            border: 1px solid #D0D7DE;
            border-radius: 8px;
            overflow: auto;
            max-height: calc(100vh - 120px);
        }

        .resources-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
        }

        .resources-table thead tr {
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .resources-table th {
            background: #2C3E50;
            color: white;
            padding: 0.7rem 0.6rem;
            text-align: left;
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #2C6B2F;
        }

        .resources-table td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid #E8EDF2;
            vertical-align: top;
            background: white;
        }

        .section-header td {
            background: #E8EDF2;
            font-weight: 700;
            font-size: 13px;
            color: #2C3E50;
        }

        .contractors-list {

            flex-direction: column;
            gap: 0.3rem;
        }

        .contractor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            padding: 0.2rem 0.3rem;
            background: #F8FAFC;
            border-radius: 4px;
        }

        .contractor-name {
            flex: 1;
            font-size: 11px;
            color: #2C6B2F;
            cursor: pointer;
            padding: 0.15rem;
        }

        .people-control {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            background: white;
            border: 1px solid #D0D7DE;
            border-radius: 4px;
            padding: 0.05rem;
        }

        .people-value {
            min-width: 40px;
            text-align: center;
            font-weight: 500;
            font-size: 12px;
            padding: 0.1rem 0;
        }

        .people-btn {
            background: none;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #2C6B2F;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .people-btn:hover {
            background: #2C6B2F;
            color: white;
        }

        .add-contractor-btn {
            background: rgba(44, 107, 47, 0.08);
            border: 1px dashed #2C6B2F;
            border-radius: 4px;
            padding: 0.2rem;
            text-align: center;
            cursor: pointer;
            font-size: 10px;
            color: #2C6B2F;
        }

        .remove-contractor {
            background: none;
            border: none;
            color: #D32F2F;
            cursor: pointer;
            font-size: 13px;
            padding: 0 0.15rem;
            border-radius: 3px;

            text-align: center;
            font-weight: 700;
            font-size: 13px;
            background: #F0F7F0;
        }

        .grand-total td {
            background: #2C6B2F;
            color: white;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            margin-top: 0.8rem;
            padding: 0.5rem;
            font-size: 0.65rem;
            color: #8A9DA8;
        }

        .home-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #e31b23, #ff4d4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
            z-index: 1000;
            text-decoration: none;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .home-button:hover {
            transform: scale(1.08);
        }

        .home-button::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background: rgba(46, 204, 113, 0.4);
            animation: pulseGreen 1.2s infinite;
            z-index: -1;
        }

        @keyframes pulseGreen {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .home-icon {
            font-size: 26px;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            background: #2C3E50;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .page-slide-out-left { animation: slideOutLeft 0.35s ease-out forwards; }
        .page-slide-in-right { animation: slideInRight 0.35s ease-out forwards; }

        @keyframes slideOutLeft {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-100%); }
        }

        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(100%); }
            100% { opacity: 1; transform: translateX(0); }
        }

                -webkit-print-color-adjust: exact;

            .resources-table td {

                border-right: 1px solid #eee;
                background: white !important;
            }
            
            .section-header td {
                background: #F0F4F8 !important;

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

                color: #000 !important;
                font-weight: bold;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            /* Запрещаем разрыв строк */
            .contractor-item {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            
            .people-control {
                border: 1px solid #ccc;
                background: white;
            }
            
            .people-value {
                color: #000;
            }
            
            .contractor-name {
                cursor: default;
                color: #000;
            }
            
            .total-people-cell {
                background: #F0F7F0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .footer {
                margin-top: 1rem;
                color: #666;
            }
            
            /* Запрещаем дублирование содержимого */
            .resources-table tbody tr {
                page-break-inside: avoid;
            }
        }

        @media (max-width: 1024px) {
            .header { display: none !important; }
            .table-wrapper { max-height: calc(100vh - 100px); }
            .home-button { width: 44px; height: 44px; bottom: 20px; right: 20px; }
            .home-icon { font-size: 22px; }

            .resources-table th { padding: 0.5rem 0.4rem; font-size: 9px; }
            .resources-table td { padding: 0.4rem; font-size: 10px; }
            .home-button { width: 40px; height: 40px; bottom: 15px; right: 15px; }
            .home-icon { font-size: 20px; }
            .people-value { min-width: 30px; font-size: 11px; }
        }

        { section: "Паркинг", subsys: "ПНР", work: "АОВ", contractors: [{name: "ООО \"СИДРЭ\"", people: 3}] }
    ];

    const STORAGE_KEY = 'ogni3_resources_final';
    let resourcesData = [];
    let navigateTimeout = null;
    let toastTimeout = null;

    function formatDate() {
        const now = new Date();
        return `${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    document.getElementById('dateBadge').textContent = `Дата: ${formatDate()}`;

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) resourcesData = JSON.parse(saved);
        else resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('Данные сохранены');
    }

    function resetData() {
        if (confirm('Сбросить все изменения?')) {
            resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
            renderTable();
            saveData();
            showToast('Сброшено к исходным');
        }
    }

    function getRowTotal(contractors) {
        return contractors.reduce((sum, c) => sum + (c.people || 0), 0);
    }

    function getTotalPeople() {
        return resourcesData.reduce((sum, item) => sum + getRowTotal(item.contractors), 0);
    }

    function changePeople(rowIndex, contractorIndex, delta) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        let newValue = contractor.people + delta;
        if (newValue < 0) newValue = 0;
        if (newValue > 999) newValue = 999;
        contractor.people = newValue;
        renderTable();
        showToast(`${contractor.name}: ${newValue} чел.`);
    }

    function addContractor(rowIndex) {
        if (resourcesData[rowIndex].contractors.length >= 3) {
            showToast('Максимум 3 подрядчика');
            return;
        }
        resourcesData[rowIndex].contractors.push({ name: 'Новый подрядчик', people: 0 });
        renderTable();
        showToast('Добавлен подрядчик');
    }

    function removeContractor(rowIndex, contractorIndex) {
        if (resourcesData[rowIndex].contractors.length === 1) {
            resourcesData[rowIndex].contractors[0] = { name: '—', people: 0 };
            renderTable();
            showToast('Подрядчик очищен');
        } else {
            resourcesData[rowIndex].contractors.splice(contractorIndex, 1);
            renderTable();
            showToast('Подрядчик удалён');
        }
    }

    function editContractorName(rowIndex, contractorIndex, element) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        const input = document.createElement('input');
        input.type = 'text';
        input.value = contractor.name === '—' ? '' : contractor.name;
        input.style.width = '100%';
        input.style.background = 'white';
        input.style.border = '1px solid #2C6B2F';
        input.style.borderRadius = '3px';
        input.style.padding = '0.15rem';
        input.style.fontSize = '11px';
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newName = input.value.trim();
            if (newName === '') newName = '—';
            contractor.name = newName;
            container.innerHTML = escapeHtml(newName);
            showToast('Название изменено');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveEdit(); });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let currentSection = '';
        
        resourcesData.forEach((item, rowIndex) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="5"><strong>${item.section}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            
            const contractorsHtml = `<div class="contractors-list">${item.contractors.map((contractor, cIndex) => `
                <div class="contractor-item">
                    <span class="contractor-name" onclick="editContractorName(${rowIndex}, ${cIndex}, this)">${escapeHtml(contractor.name)}</span>
                    <div class="people-control">
                        <button class="people-btn" onclick="event.stopPropagation(); changePeople(${rowIndex}, ${cIndex}, -1)">−</button>
                        <span class="people-value">${contractor.people}</span>
                        <button class="people-btn" onclick="event.stopPropagation(); changePeople(${rowIndex}, ${cIndex}, 1)">+</button>
                    </div>
                    <button class="remove-contractor" onclick="event.stopPropagation(); removeContractor(${rowIndex}, ${cIndex})">×</button>
                </div>
            `).join('')}${item.contractors.length < 3 ? `<div class="add-contractor-btn" onclick="addContractor(${rowIndex})">+ Добавить подрядчика</div>` : ''}</div>`;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${escapeHtml(item.section)}</td>
                <td>${escapeHtml(item.subsys)}</td>
                <td>${escapeHtml(item.work)}</td>
                <td>${contractorsHtml}</td>
                <td class="total-people-cell">${getRowTotal(item.contractors)}</td>
            `;
            tbody.appendChild(row);
        });
        
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        totalRow.innerHTML = `<td colspan="4"><strong>ВСЕГО ЧЕЛОВЕК</strong></td><td class="total-people-cell" style="text-align: center;"><strong>${getTotalPeople()}</strong></td>`;
        tbody.appendChild(totalRow);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    function showToast(message) {
        const toast = document.getElementById('toast');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        
        if (toast.classList.contains('show')) {
            toast.classList.remove('show');
            setTimeout(() => {
                toast.textContent = message;
                toast.classList.add('show');
                startHideTimer(toast);
            }, 200);
        } else {
            toast.textContent = message;
            toast.classList.add('show');
            startHideTimer(toast);
        }
    }
    
    function startHideTimer(toast) {
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
            toastTimeout = null;
        }, 1000);
        setTimeout(() => {
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toastTimeout = null;
            }
            toast.classList.remove('show');
        }, 1300);
    }
    
    function navigateToHome() {
        if (navigateTimeout) return;
        const container = document.getElementById('pageContainer');
        navigateTimeout = setTimeout(() => {
            container.classList.add('page-slide-out-left');
            setTimeout(() => { window.location.href = 'index.html'; }, 350);
            navigateTimeout = null;
        }, 1000);
    }
    
    function cancelNavigation() {
        if (navigateTimeout) {
            clearTimeout(navigateTimeout);
            navigateTimeout = null;
        }
    }
    
    function exportToPDF() {
        showToast('Подготовка PDF...');
        setTimeout(() => { window.print(); }, 300);
    }
    
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('pdfBtn').addEventListener('click', exportToPDF);
    
    document.getElementById('backBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        showToast('Переход на главную через 1 секунду...');
        navigateToHome();
    });
    
    document.getElementById('backLogo')?.addEventListener('click', (e) => {
        e.preventDefault();
        showToast('Переход на главную через 1 секунду...');
        navigateToHome();
    });
    
    document.getElementById('homeBtn').addEventListener('click', (e) => {
        e.preventDefault();
        showToast('Переход на главную через 1 секунду...');
        navigateToHome();
    });
    
    document.querySelector('.table-wrapper')?.addEventListener('click', cancelNavigation);
    document.querySelector('.admin-panel')?.addEventListener('click', cancelNavigation);
    
    document.getElementById('pageContainer').classList.add('page-slide-in-right');
    setTimeout(() => {
        document.getElementById('pageContainer').classList.remove('page-slide-in-right');
    }, 500);
    
    loadData();
</script>
