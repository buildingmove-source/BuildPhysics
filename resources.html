<html lang="ru">

            padding: 0;
            box-sizing: border-box;
        }

            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Шапка - матовое стекло */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-radius: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .logo-icon {
            background: rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: white;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        /* Панель управления */
        .admin-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-badge {
            background: rgba(45, 106, 255, 0.8);
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }

        .info-text {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 1rem;
        }

        .save-btn, .pdf-btn, .reset-btn {
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-btn {
            background: #2D6AFF;
            color: white;
        }

        .save-btn:hover {
            background: #00B4D8;
            transform: scale(1.02);
        }

        .pdf-btn {
            background: #34a853;
            color: white;
        }

        .pdf-btn:hover {
            background: #2c8e47;
            transform: scale(1.02);
        }

        .reset-btn {
            background: #dc3545;
            color: white;
        }

        .reset-btn:hover {
            background: #b02a37;
            transform: scale(1.02);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1A1A2E;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            z-index: 2000;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Контейнер таблицы с фиксированной шапкой */
        .table-wrapper {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        /* Фиксированная шапка таблицы */
        .resources-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
        }

        .resources-table thead tr {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .resources-table th {
            background: rgba(45, 106, 255, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 0.8rem;
            text-align: left;
            font-weight: 600;
            font-size: 16px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .resources-table td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            vertical-align: top;
            color: #1A1A2E;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.85);
        }

        .resources-table tr:hover td {
            background: rgba(255, 255, 255, 0.95);
        }

        /* Ячейка с несколькими подрядчиками */
        .contractors-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .contractor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.3rem 0.5rem;
            background: #F0F4F8;
            border-radius: 8px;

        }

            min-width: 120px;
            font-size: 14px;
            color: #1A1A2E;
        }

        .contractor-people {

            color: white;
            border-radius: 8px;
            padding: 0.2rem 0.5rem;
            min-width: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .contractor-people:hover {
            background: #00B4D8;
            transform: scale(1.02);
        }

        .contractor-people input {
            width: 55px;
            background: white;
            border: 1px solid #2D6AFF;
            border-radius: 6px;
            padding: 0.2rem;
            text-align: center;
            font-size: 14px;
            font-family: 'Arial', Helvetica, sans-serif;
            color: #1A1A2E;
        }

        .add-contractor-btn {
            background: rgba(45, 106, 255, 0.2);
            border: 1px dashed #2D6AFF;
            border-radius: 8px;
            padding: 0.3rem;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            color: #2D6AFF;
            transition: all 0.2s;
        }

        .add-contractor-btn:hover {
            background: rgba(45, 106, 255, 0.4);
        }

            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 16px;
            padding: 0 0.3rem;
            border-radius: 50%;
        }

        .remove-contractor:hover {
            background: rgba(220, 53, 69, 0.2);
        }

        .section-header td {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            font-weight: 700;
            font-size: 18px;
            color: white;
            padding: 0.8rem;

            color: white;

        .footer {

            .contractor-name {

            body {

                padding: 0;
            }
            .admin-panel, .back-btn, .save-btn, .pdf-btn, .reset-btn, .toast {

            }
            .header {

                margin-bottom: 1rem;
                padding: 0.5rem;
                position: static;
            }

            }
            .table-wrapper {

                backdrop-filter: none;
            }

                border-bottom: 1px solid #ddd;
            }

                color: #1A1A2E;
            }

                background: #2D6AFF;
                color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .fade-out {
            animation: fadeOut 0.4s ease-out forwards;
        }
    </style>
</head>

    ];

    const STORAGE_KEY = 'ogni3_resources_v2';

    function formatDate() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    document.getElementById('dateBadge').textContent = `Дата формирования: ${formatDate()}`;

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            resourcesData = JSON.parse(saved);
        } else {
            resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
        }
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('Изменения сохранены');
    }

    function resetData() {
        if (confirm('Сбросить все изменения к исходным значениям?')) {
            resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
            renderTable();
            saveData();
            showToast('Данные сброшены к исходным');
        }
    }

    function getTotalPeople() {
        let total = 0;
        resourcesData.forEach(item => {
            item.contractors.forEach(c => {
                total += c.people || 0;
            });
        });
        return total;
    }

    function editContractor(rowIndex, contractorIndex, element) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        const currentValue = contractor.people;
        const input = document.createElement('input');
        input.type = 'number';
        input.value = currentValue;
        input.min = 0;
        input.max = 99;
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newValue = parseInt(input.value, 10);
            if (isNaN(newValue)) newValue = 0;
            if (newValue < 0) newValue = 0;
            if (newValue > 99) newValue = 99;
            contractor.people = newValue;
            container.innerHTML = newValue;
            renderTable(); // Обновляем итоги
            showToast('Значение изменено. Нажмите "Сохранить изменения"');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });
    }

    function addContractor(rowIndex) {
        if (resourcesData[rowIndex].contractors.length >= 3) {
            showToast('Нельзя добавить более 3 подрядчиков на одну работу');
            return;
        }
        resourcesData[rowIndex].contractors.push({ name: 'Новый подрядчик', people: 0 });
        renderTable();
        showToast('Добавлен новый подрядчик. Нажмите на название для редактирования');
    }

    function removeContractor(rowIndex, contractorIndex) {
        if (resourcesData[rowIndex].contractors.length === 1) {
            resourcesData[rowIndex].contractors[0] = { name: '', people: 0 };
            renderTable();
            showToast('Подрядчик очищен');
        } else {
            resourcesData[rowIndex].contractors.splice(contractorIndex, 1);
            renderTable();
            showToast('Подрядчик удален');
        }
    }

    function editContractorName(rowIndex, contractorIndex, element) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        const currentName = contractor.name;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentName;
        input.style.width = '100%';
        input.style.background = 'white';
        input.style.border = '1px solid #2D6AFF';
        input.style.borderRadius = '6px';
        input.style.padding = '0.2rem';
        input.style.fontSize = '14px';
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newName = input.value.trim();
            if (newName === '') newName = '—';
            contractor.name = newName;
            container.innerHTML = escapeHtml(newName);
            showToast('Название подрядчика изменено');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let currentSection = '';
        
        resourcesData.forEach((item, rowIndex) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="5"><strong>${item.section}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            
            const row = document.createElement('tr');
            
            // Создаем HTML для подрядчиков
            let contractorsHtml = '<div class="contractors-list">';
            item.contractors.forEach((contractor, cIndex) => {
                contractorsHtml += `
                    <div class="contractor-item">
                        <span class="contractor-name" onclick="editContractorName(${rowIndex}, ${cIndex}, this)">${escapeHtml(contractor.name || '—')}</span>
                        <span class="contractor-people" onclick="editContractor(${rowIndex}, ${cIndex}, this)">${contractor.people}</span>
                        <button class="remove-contractor" onclick="event.stopPropagation(); removeContractor(${rowIndex}, ${cIndex})">✕</button>
                    </div>
                `;
            });
            if (item.contractors.length < 3) {
                contractorsHtml += `<div class="add-contractor-btn" onclick="addContractor(${rowIndex})">+ Добавить подрядчика</div>`;
            }
            contractorsHtml += '</div>';
            
            row.innerHTML = `
                <td>${escapeHtml(item.subsys)}</td>
                <td>${escapeHtml(item.work)}</td>
                <td>${contractorsHtml}</td>
                <td style="text-align: center; vertical-align: middle;">${item.contractors.reduce((sum, c) => sum + (c.people || 0), 0)}</td>
            `;
            tbody.appendChild(row);
        });
        
        // Итоговая строка
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        const totalPeople = getTotalPeople();
        totalRow.innerHTML = `
            <td colspan="3"><strong>ВСЕГО ЧЕЛОВЕК</strong></td>
            <td style="text-align: center;"><strong>${totalPeople}</strong></td>
        `;
        tbody.appendChild(totalRow);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
    
    function animateAndNavigate(url) {
        const container = document.getElementById('pageContainer');
        container.classList.add('fade-out');
        setTimeout(() => {
            window.location.href = url;
        }, 400);
    }
    
    function saveToPDF() {
        showToast('Подготовка PDF...');
        setTimeout(() => {
            window.print();
        }, 100);
    }
    
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('pdfBtn').addEventListener('click', saveToPDF);
    
    loadData();
</script>
