        { section: "Паркинг", subsys: "Вентиляция", work: "Монтаж клапанов и вентоборудования", contractors: [{name: "—", people: 3}] },

        { section: "Паркинг", subsys: "ВК", work: "Гидравлика", contractors: [{name: "—", people: 2}] },
        { section: "Паркинг", subsys: "ВК", work: "Изоляция", contractors: [{name: "—", people: 3}] },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Монтаж сплинкеров и ДППК", contractors: [{name: "ООО \"ПСК-28\"", people: 4}] },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Гидравлика", contractors: [{name: "—", people: 2}] },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУЭ", contractors: [{name: "ООО \"Призмер\"", people: 3}] },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУВТ", contractors: [{name: "—", people: 3}] },
        { section: "Паркинг", subsys: "ПНР", work: "АРМ АСУД", contractors: [{name: "—", people: 3}] },
        { section: "Паркинг", subsys: "ПНР", work: "АОВ", contractors: [{name: "ООО \"СИДРЭ\"", people: 3}] }
    ];

    const STORAGE_KEY = 'ogni3_resources_final';
    let resourcesData = [];
    let toastTimeout = null;

    // GitHub настройки
    const GITHUB_USERNAME = "buildingmove-source";
    const GITHUB_REPO = "BuildPhysics";
    let githubToken = null;

    function formatDate() {
        const now = new Date();
        return `${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    document.getElementById('dateBadge').textContent = `Дата: ${formatDate()}`;

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                resourcesData = JSON.parse(saved);
            } catch(e) {
                resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
            }
        } else {
            resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
        }
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('✅ Данные сохранены');
    }

    function resetData() {
        if (confirm('Сбросить все изменения?')) {
            resourcesData = JSON.parse(JSON.stringify(initialDataRaw));
            renderTable();
            saveData();
            showToast('🔄 Сброшено к исходным');
        }
    }

    function getRowTotal(contractors) {
        return contractors.reduce((sum, c) => sum + (c.people || 0), 0);
    }

    function getTotalPeople() {
        return resourcesData.reduce((sum, item) => sum + getRowTotal(item.contractors), 0);
    }

    function changePeople(rowIndex, contractorIndex, delta) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        let newValue = contractor.people + delta;
        if (newValue < 0) newValue = 0;
        if (newValue > 999) newValue = 999;
        contractor.people = newValue;
        renderTable();
        showToast(`${contractor.name}: ${newValue} чел.`);
    }

    function addContractor(rowIndex) {
        if (resourcesData[rowIndex].contractors.length >= 3) {
            showToast('⚠️ Максимум 3 подрядчика');
            return;
        }
        resourcesData[rowIndex].contractors.push({ name: 'Новый подрядчик', people: 0 });
        renderTable();
        showToast('➕ Добавлен подрядчик');
    }

    function removeContractor(rowIndex, contractorIndex) {
        if (resourcesData[rowIndex].contractors.length === 1) {
            resourcesData[rowIndex].contractors[0] = { name: '—', people: 0 };
            renderTable();
            showToast('🗑️ Подрядчик очищен');
        } else {
            resourcesData[rowIndex].contractors.splice(contractorIndex, 1);
            renderTable();
            showToast('🗑️ Подрядчик удалён');
        }
    }

    function editContractorName(rowIndex, contractorIndex, element) {
        const contractor = resourcesData[rowIndex].contractors[contractorIndex];
        const input = document.createElement('input');
        input.type = 'text';
        input.value = contractor.name === '—' ? '' : contractor.name;
        input.style.cssText = 'width:100%; background:white; border:1px solid #2C6B2F; border-radius:3px; padding:0.2rem; font-size:11px;';
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        const saveEdit = () => {
            let newName = input.value.trim();
            if (newName === '') newName = '—';
            contractor.name = newName;
            container.innerHTML = escapeHtml(newName);
            showToast('✏️ Название изменено');
        };
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveEdit(); });
    }

    function editWorkName(rowIndex, element) {
        const currentWork = resourcesData[rowIndex].work;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentWork;
        input.style.cssText = 'width:100%; background:white; border:1px solid #2C6B2F; border-radius:3px; padding:0.3rem; font-size:11px;';
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        const saveEdit = () => {
            let newWork = input.value.trim();
            if (newWork === '') newWork = currentWork;
            resourcesData[rowIndex].work = newWork;
            container.innerHTML = escapeHtml(newWork);
            showToast('✏️ Наименование работ изменено');
            renderTable();
        };
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveEdit(); });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let currentSection = '';
        resourcesData.forEach((item, rowIndex) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="5"><strong>${escapeHtml(item.section)}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            let contractorsHtml = '<div class="contractors-list">';
            item.contractors.forEach((contractor, cIndex) => {
                contractorsHtml += `
                    <div class="contractor-item">
                        <span class="contractor-name" onclick="editContractorName(${rowIndex}, ${cIndex}, this)">${escapeHtml(contractor.name)}</span>
                        <div class="people-control">
                            <button class="people-btn" onclick="changePeople(${rowIndex}, ${cIndex}, -1)">−</button>
                            <span class="people-value">${contractor.people}</span>
                            <button class="people-btn" onclick="changePeople(${rowIndex}, ${cIndex}, 1)">+</button>
                        </div>
                        <button class="remove-contractor" onclick="removeContractor(${rowIndex}, ${cIndex})">×</button>
                    </div>
                `;
            });
            if (item.contractors.length < 3) {
                contractorsHtml += `<div class="add-contractor-btn" onclick="addContractor(${rowIndex})">+ Добавить подрядчика</div>`;
            }
            contractorsHtml += '</div>';
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${escapeHtml(item.section)}</td>
                <td>${escapeHtml(item.subsys)}</td>
                <td class="editable-work-cell" onclick="editWorkName(${rowIndex}, this)">${escapeHtml(item.work)}</td>
                <td>${contractorsHtml}</td>
                <td class="total-people-cell">${getRowTotal(item.contractors)}</td>
            `;
            tbody.appendChild(row);
        });
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        totalRow.innerHTML = `<td colspan="4"><strong>ВСЕГО ЧЕЛОВЕК</strong></td><td class="total-people-cell" style="text-align: center;"><strong>${getTotalPeople()}</strong></td>`;
        tbody.appendChild(totalRow);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    
    function showToast(message) {
        const toast = document.getElementById('toast');
        if (toastTimeout) clearTimeout(toastTimeout);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
    
    // ===== ЭКСПОРТ В РЕПОЗИТОРИЙ =====
    function loadGitHubToken() {
        const saved = localStorage.getItem('github_pat_token');
        if (saved) githubToken = saved;
    }
    
    function saveGitHubToken(token) {
        githubToken = token;
        localStorage.setItem('github_pat_token', token);
    }
    
    function showTokenPanel() {
        let panel = document.getElementById('tokenPanel');
        if (!panel) {
            const adminPanel = document.querySelector('.admin-panel');
            panel = document.createElement('div');
            panel.id = 'tokenPanel';
            panel.style.cssText = 'background:white; border:1px solid #D0D7DE; border-radius:8px; padding:0.8rem; margin-bottom:1rem; display:none;';
            panel.innerHTML = `
                <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
                    <span style="font-weight:600;">🔑 Токен GitHub:</span>
                    <input type="password" id="githubTokenInput" placeholder="ghp_XXXXXXXXXXXXXXXXXXXX" style="flex:1; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
                    <button id="saveTokenBtn" class="btn btn-save">Сохранить токен</button>
                </div>
                <div style="font-size:0.65rem; color:#666; margin-top:0.5rem;">
                    ⚠️ Токен нужен для сохранения файла в репозиторий. 
                    <a href="https://github.com/settings/tokens" target="_blank">Создать токен</a> (нужны права: repo)
                </div>
            `;
            adminPanel.parentNode.insertBefore(panel, adminPanel.nextSibling);
            document.getElementById('saveTokenBtn')?.addEventListener('click', () => {
                const token = document.getElementById('githubTokenInput').value.trim();
                if (token) {
                    saveGitHubToken(token);
                    panel.style.display = 'none';
                    showToast('🔑 Токен сохранён');
                    exportToRepository();
                } else {
                    showToast('❌ Введите корректный токен');
                }
            });
        }
        panel.style.display = 'block';
    }
    
    async function exportToRepository() {
        loadGitHubToken();
        if (!githubToken) {
            showTokenPanel();
            showToast('⚠️ Введите токен GitHub');
            return;
        }
        
        const now = new Date();
        const dateStr = `${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        const fileName = `Ресурсы_Огни3_${dateStr.replace(/\./g, '-')}.html`;
        
        let exportRows = [];
        let currentSection = '';
        resourcesData.forEach((item) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                exportRows.push({ type: 'section', section: item.section });
            }
            const contractorsList = item.contractors.map(c => `${c.name}: ${c.people}`).join('; ');
            exportRows.push({ type: 'row', section: item.section, subsys: item.subsys, work: item.work, contractors: contractorsList, total: getRowTotal(item.contractors) });
        });
        const totalPeople = getTotalPeople();
        
        let tableRows = '';
        exportRows.forEach(row => {
            if (row.type === 'section') {
                tableRows += `<tr class="section-header"><td colspan="5"><strong>${escapeHtml(row.section)}</strong></td></tr>`;
            } else {
                tableRows += `<tr>
                    <td>${escapeHtml(row.section)}</td>
                    <td>${escapeHtml(row.subsys)}</td>
                    <td>${escapeHtml(row.work)}</td>
                    <td>${escapeHtml(row.contractors)}</td>
                    <td style="text-align:center">${row.total}</td>
                </tr>`;
            }
        });
        
        const exportHtml = `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ресурсы Огни 3 от ${dateStr}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Arial', sans-serif; background: white; padding: 20px; color: #1a1a2e; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #2C6B2F; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        th { background: #2C3E50; color: white; padding: 10px; text-align: left; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #ddd; vertical-align: top; }
        .section-header td { background: #E8EDF2; font-weight: bold; }
        .grand-total td { background: #2C6B2F; color: white; font-weight: bold; }
        .footer { text-align: center; margin-top: 20px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 10px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Ресурсы · Трудовые ресурсы</h1>
        <p>АО «Огни 3» · Дата формирования: ${dateStr} ${timeStr}</p>
    </div>
    <table>
        <thead>
            <tr><th>Объект/Секция</th><th>Раздел ВИС</th><th>Наименование работ</th><th>Подрядная организация / кол-во</th><th>Всего, чел.</th></tr>
        </thead>
        <tbody>
            ${tableRows}
            <tr class="grand-total"><td colspan="4"><strong>ВСЕГО ЧЕЛОВЕК</strong></td><td style="text-align:center"><strong>${totalPeople}</strong></td></tr>
        </tbody>
    </table>
    <div class="footer">Данные актуальны на момент формирования · АО «Огни 3»</div>
</div>
</body>
</html>`;
        
        showToast('📤 Сохранение в репозиторий...');
        try {
            let sha = null;
            const getRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${fileName}`, {
                headers: { 'Authorization': `token ${githubToken}` }
            });
            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha;
            }
            
            const uploadRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${fileName}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${githubToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Экспорт ресурсов от ${dateStr} ${timeStr}`,
                    content: btoa(unescape(encodeURIComponent(exportHtml))),
                    sha: sha
                })
            });
            
            if (uploadRes.ok) {
                showToast('✅ Файл сохранён в репозиторий!');
                localStorage.setItem('needRefreshFiles', 'true');
            } else {
                const err = await uploadRes.json();
                showToast(`❌ Ошибка: ${err.message || 'Неизвестная ошибка'}`);
            }
        } catch(e) {
            showToast(`❌ Ошибка соединения: ${e.message}`);
        }
    }
    
    function navigateToHome() {
        document.getElementById('pageContainer').classList.add('page-slide-out-left');
        setTimeout(() => { window.location.href = 'index.html'; }, 350);
    }
    
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('exportBtn').addEventListener('click', exportToRepository);
    document.getElementById('backBtn')?.addEventListener('click', (e) => { e.preventDefault(); navigateToHome(); });
    document.getElementById('backLogo')?.addEventListener('click', (e) => { e.preventDefault(); navigateToHome(); });
    document.getElementById('homeBtn').addEventListener('click', (e) => { e.preventDefault(); navigateToHome(); });
    
    loadData();
</script>
</body>
</html>
