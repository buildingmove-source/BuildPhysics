        .logo:hover {

        .logo-icon {

            height: 44px;

            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #00B4D8);

            color: transparent;

        .title-block {

        }

            font-weight: 700;

        }

        { section: "Паркинг", subsys: "ВК", work: "Изоляция", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Монтаж сплинкеров и ДППК", responsible: "ООО \"ПСК-28\"", people: 4 },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Гидравлика", responsible: "", people: 2 },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУЭ", responsible: "ООО \"Призмер\"", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУВТ", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АРМ АСУД", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АОВ", responsible: "ООО \"СИДРЭ\"", people: 3 }
    ];

    const STORAGE_KEY = 'ogni3_resources_data';
    let resourcesData = [];

    // Установка текущей даты
    function setCurrentDate() {
        const now = new Date();
        const formatted = now.toLocaleDateString('ru-RU', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        document.getElementById('currentDate').innerHTML = `📅 Данные на: ${formatted}`;
    }

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            resourcesData = JSON.parse(saved);
        } else {
            resourcesData = JSON.parse(JSON.stringify(initialData));
        }
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('💾 Все изменения сохранены в браузере!');
    }

    function resetData() {
        if (confirm('Вы уверены, что хотите сбросить все изменения к исходным значениям?')) {
            resourcesData = JSON.parse(JSON.stringify(initialData));
            renderTable();
            saveData();
            showToast('⟳ Данные сброшены к исходным');
        }
    }

    // Экспорт в JSON с сохранением на компьютер в папку /Users/Vladimir/Documents/Ресурсы Огни 3
    function exportToJSON() {
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 19).replace(/:/g, '-');
        const fileName = `Ресурсы_Огни3_${dateStr}.json`;
        
        const exportData = {
            exportDate: now.toLocaleString('ru-RU'),
            data: resourcesData,
            totalPeople: resourcesData.reduce((sum, item) => sum + (item.people || 0), 0)
        };
        
        const jsonStr = JSON.stringify(exportData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showToast(`📎 Файл "${fileName}" сохранён на компьютер`);
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let currentSection = '';
        
        resourcesData.forEach((item, index) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="4"><strong>🏗️ ${item.section}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding-left: 1.5rem;">${escapeHtml(item.subsys)}</td>
                <td>${escapeHtml(item.work)}</td>
                <td>${escapeHtml(item.responsible) || '—'}</td>
                <td style="text-align: center;">
                    <span class="editable-cell" onclick="editPeople(${index}, this)">
                        ${item.people}
                    </span>
                </td>
            `;
            tbody.appendChild(row);
        });
        
        // Итоговая строка
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        const totalPeople = resourcesData.reduce((sum, item) => sum + (item.people || 0), 0);
        totalRow.innerHTML = `
            <td colspan="3"><strong>📊 ИТОГО ЧЕЛОВЕК</strong></td>
            <td style="text-align: center;"><strong style="font-size: 1.2rem;">${totalPeople}</strong></td>
        `;
        tbody.appendChild(totalRow);
    }
    
    window.editPeople = function(index, element) {
        const currentValue = resourcesData[index].people;
        const input = document.createElement('input');
        input.type = 'number';
        input.value = currentValue;
        input.min = 0;
        input.max = 99;
        input.style.width = '65px';
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newValue = parseInt(input.value, 10);
            if (isNaN(newValue)) newValue = 0;
            if (newValue < 0) newValue = 0;
            if (newValue > 99) newValue = 99;
            resourcesData[index].people = newValue;
            container.innerHTML = newValue;
            renderTable();
            showToast('✏️ Значение изменено. Нажмите «Сохранить»');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveEdit();
            }
        });
    };
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
    
    // Инициализация
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('exportBtn').addEventListener('click', exportToJSON);
    
    setCurrentDate();
    loadData();
</script>
</body>
</html>
