            padding: 0;
            box-sizing: border-box;
        }

            background: #F5F7FA;

            color: #1A1A2E;
            padding: 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Шапка - светлая, без эмодзи */
        .header {
            background: #FFFFFF;
            border-bottom: 2px solid #E8ECF0;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .logo-icon {
            background: #2D6AFF;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2D6AFF;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1A1A2E;
        }

        .date-badge {
            background: #E8ECF0;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1A1A2E;
        }

        .back-btn {
            background: #2D6AFF;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .back-btn:hover {
            background: #00B4D8;
            transform: scale(1.02);
        }

        /* Панель управления - скрывается при печати */
        .admin-panel {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #E8ECF0;
        }

        .admin-badge {
            background: #2D6AFF;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }

        .save-btn, .pdf-btn, .reset-btn {
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-btn {
            background: #2D6AFF;
            color: white;
        }

        .save-btn:hover {
            background: #00B4D8;
            transform: scale(1.02);
        }

        .pdf-btn {
            background: #34a853;
            color: white;
        }

        .pdf-btn:hover {
            background: #2c8e47;
            transform: scale(1.02);
        }

        .reset-btn {
            background: #dc3545;
            color: white;
        }

        .reset-btn:hover {
            background: #b02a37;
            transform: scale(1.02);
        }

        /* Toast уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1A1A2E;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            z-index: 2000;
            transition: transform 0.3s ease, opacity 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Таблица ресурсов - светлая тема */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            background: #FFFFFF;
            border: 1px solid #E8ECF0;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .resources-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            min-width: 800px;
        }

        .resources-table th {
            background: #2D6AFF;
            color: white;
            padding: 0.8rem;
            text-align: left;
            font-weight: 600;
            font-size: 16px;
            border-bottom: 2px solid #E8ECF0;
        }

        .resources-table td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #E8ECF0;
            vertical-align: top;
            color: #1A1A2E;
            font-size: 16px;
        }

        .resources-table tr:hover {
            background: #F0F4F8;
        }

        .editable-cell {
            background: #F0F4F8;
            border-radius: 8px;
            padding: 0.3rem 0.6rem;
            min-width: 60px;
            text-align: center;
            cursor: pointer;
            display: inline-block;
            transition: all 0.2s;
            color: #1A1A2E;
        }

        .editable-cell:hover {
            background: #2D6AFF;
            color: white;
        }

        .editable-cell input {
            width: 60px;
            background: white;
            border: 1px solid #2D6AFF;
            border-radius: 6px;
            padding: 0.3rem;
            text-align: center;
            font-size: 16px;
            font-family: 'Arial', Helvetica, sans-serif;
        }

        .section-header td {
            background: #E8ECF0;
            font-weight: 700;
            font-size: 18px;
            color: #1A1A2E;
            padding: 0.8rem;
        }

        .sub-total {
            background: #F0F4F8;
            font-weight: 600;
        }

        .grand-total {
            background: #2D6AFF;
            font-weight: 700;
            color: white;
        }

        .grand-total td {
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            font-size: 0.7rem;
            color: #8A9BDF;
        }

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .resources-table th, .resources-table td {
                padding: 0.5rem;
                font-size: 14px;
            }
            .editable-cell input {
                width: 50px;
                font-size: 14px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .admin-panel, .back-btn, .save-btn, .pdf-btn, .reset-btn, .toast, .logo, .date-badge {
                display: none !important;
            }
            .header {
                background: white;
                border-bottom: 2px solid #ddd;
                margin-bottom: 1rem;
                padding: 0.5rem;
                box-shadow: none;
            }
            .title {
                color: #1A1A2E;
            }
            .resources-table th {
                background: #2D6AFF;
                color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .grand-total td {
                background: #2D6AFF;
                color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .section-header td {
                background: #E8ECF0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .editable-cell {
                background: none;
                cursor: default;
            }
            .editable-cell input {
                display: none;
            }
            .table-wrapper {
                overflow: visible;
                box-shadow: none;
            }
        }

        /* Анимация перехода между страницами */
        .fade-out {
            animation: fadeOut 0.4s ease-out forwards;
        }

            from {

                transform: translateY(0);

        { section: "Паркинг", subsys: "Отопление", work: "Гребенки", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "Отопление", work: "Разводка трубы и монтаж радиаторов", responsible: "", people: 4 },
        { section: "Паркинг", subsys: "Отопление", work: "Гидравлические испытания", responsible: "", people: 2 },
        { section: "Паркинг", subsys: "Отопление", work: "Изоляция", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "Вентиляция", work: "Монтаж воздуховодов и врезок под клапана", responsible: "ООО \"ПСК-28\"", people: 3 },
        { section: "Паркинг", subsys: "Вентиляция", work: "Монтаж клапанов и вентоборудования", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ВК", work: "Стояки", responsible: "", people: 4 },
        { section: "Паркинг", subsys: "ВК", work: "Гребенки", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ВК", work: "КПК", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ВК", work: "Гидравлика", responsible: "", people: 2 },
        { section: "Паркинг", subsys: "ВК", work: "Изоляция", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Монтаж сплинкеров и ДППК", responsible: "ООО \"ПСК-28\"", people: 4 },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Гидравлика", responsible: "", people: 2 },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУЭ", responsible: "ООО \"Призмер\"", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУВТ", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АРМ АСУД", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АОВ", responsible: "ООО \"СИДРЭ\"", people: 3 }
    ];

    const STORAGE_KEY = 'ogni3_resources_data';
    let resourcesData = [];

    // Форматирование даты
    function formatDate() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    document.getElementById('dateBadge').textContent = `Дата формирования: ${formatDate()}`;

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            resourcesData = JSON.parse(saved);
        } else {
            resourcesData = JSON.parse(JSON.stringify(initialData));
        }
        renderTable();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('Изменения сохранены');
    }

    function resetData() {
        if (confirm('Сбросить все изменения к исходным значениям?')) {
            resourcesData = JSON.parse(JSON.stringify(initialData));
            renderTable();
            saveData();
            showToast('Данные сброшены к исходным');
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let currentSection = '';
        
        resourcesData.forEach((item, index) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="5"><strong>${item.section}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding-left: 1.5rem;">${escapeHtml(item.subsys)}</td>
                <td>${escapeHtml(item.work)}</td>
                <td>${escapeHtml(item.responsible) || '—'}</td>
                <td style="text-align: center;">
                    <span class="editable-cell" onclick="editPeople(${index}, this)">
                        ${item.people}
                    </span>
                </table>
            `;
            tbody.appendChild(row);
        });
        
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        const totalPeople = resourcesData.reduce((sum, item) => sum + (item.people || 0), 0);
        totalRow.innerHTML = `
            <td colspan="3"><strong>ВСЕГО ЧЕЛОВЕК</strong></td>
            <td style="text-align: center;"><strong>${totalPeople}</strong></td>
        `;
        tbody.appendChild(totalRow);
    }
    
    window.editPeople = function(index, element) {
        const currentValue = resourcesData[index].people;
        const input = document.createElement('input');
        input.type = 'number';
        input.value = currentValue;
        input.min = 0;
        input.max = 99;
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newValue = parseInt(input.value, 10);
            if (isNaN(newValue)) newValue = 0;
            if (newValue < 0) newValue = 0;
            if (newValue > 99) newValue = 99;
            resourcesData[index].people = newValue;
            container.innerHTML = newValue;
            renderTable();
            showToast('Значение изменено. Нажмите "Сохранить изменения"');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveEdit();
            }
        });
    };
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
    
    // Анимация перехода между страницами
    function animateAndNavigate(url) {
        const container = document.getElementById('pageContainer');
        container.classList.add('fade-out');
        setTimeout(() => {
            window.location.href = url;
        }, 400);
    }
    
    // Сохранение в PDF
    function saveToPDF() {
        const adminPanel = document.getElementById('adminPanel');
        const originalDisplay = adminPanel.style.display;
        adminPanel.style.display = 'none';
        
        const originalTitle = document.title;
        document.title = `Ресурсы_Огни3_${formatDate().replace(/[:\s]/g, '_')}`;
        
        showToast('Подготовка PDF...');
        
        setTimeout(() => {
            window.print();
            adminPanel.style.display = originalDisplay;
            document.title = originalTitle;
        }, 100);
    }
    
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('pdfBtn').addEventListener('click', saveToPDF);
    
    loadData();
</script>
</body>
