        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            background: #F5F7FA;
            font-family: Arial, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1A1A2E;
            padding: 1rem;
            font-size: 16px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Плавная анимация между страницами */
        .fade-enter {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Шапка */
        .header {
            background: #FFFFFF;
            border-bottom: 2px solid #E2E8F0;
            padding: 0.75rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo-icon {
            background: linear-gradient(135deg, #FFA500, #FF6B35);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1A1A2E;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1A1A2E;
        }

        .back-btn {
            background: #F0F2F5;
            border: 1px solid #E2E8F0;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1A1A2E;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: #2D6AFF;
            color: white;
            border-color: #2D6AFF;
        }

        /* Панель управления */
        .admin-panel {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
        }

        .admin-badge {
            background: #FFA500;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1A1A2E;
        }

        .save-btn, .pdf-btn {
            background: #2D6AFF;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .save-btn:hover, .pdf-btn:hover {
            background: #1A4FD0;
            transform: scale(1.02);
        }

        .reset-btn {
            background: #EF4444;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #DC2626;
            transform: scale(1.02);
        }

        .date-badge {
            font-size: 0.8rem;
            color: #6B7280;
            background: #F0F2F5;
            padding: 0.3rem 1rem;
            border-radius: 40px;
        }

        /* Toast уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1A1A2E;
            border-left: 4px solid #34a853;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            color: white;
            font-size: 0.8rem;
            z-index: 2000;
            transition: transform 0.3s ease, opacity 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Таблица ресурсов */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .resources-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            font-family: Arial, sans-serif;
            min-width: 800px;
        }

        .resources-table th {
            background: #F0F2F5;
            padding: 1rem 0.8rem;
            text-align: left;
            font-weight: 700;
            color: #1A1A2E;
            border-bottom: 2px solid #E2E8F0;
            font-size: 16px;
        }

        .resources-table td {
            padding: 0.8rem;
            border-bottom: 1px solid #E2E8F0;
            vertical-align: top;
            color: #1A1A2E;
            font-size: 15px;
        }

        .resources-table tr:hover {
            background: #F8FAFE;
        }

        .editable-cell {
            background: #F0F2F5;
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            min-width: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
            font-weight: 600;
        }

        .editable-cell:hover {
            background: #FFA500;
            color: white;
        }

        .editable-cell input {
            width: 60px;
            background: white;
            border: 1px solid #2D6AFF;
            border-radius: 6px;
            padding: 0.4rem;
            color: #1A1A2E;
            text-align: center;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .section-header {
            background: #E8EDF5;
            font-weight: 700;
        }

        .section-header td {
            background: #E8EDF5;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 17px;
        }

        .sub-total {
            background: #FEF3C7;
            font-weight: 600;
        }

        .grand-total {
            background: #DCFCE7;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            font-size: 0.75rem;
            color: #6B7280;
        }

        @media (max-width: 768px) {
            body { padding: 0.5rem; font-size: 14px; }
            .header { flex-direction: column; text-align: center; }
            .resources-table th, .resources-table td { padding: 0.5rem; font-size: 13px; }
        }

        /* Для PDF */
        @media print {
            body { background: white; padding: 0; }
            .admin-panel, .back-btn, .toast { display: none; }

        }

</head>

        { section: "Паркинг", subsys: "Вентиляция", work: "Монтаж клапанов и вентоборудования", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ВК", work: "Стояки", responsible: "", people: 4 },
        { section: "Паркинг", subsys: "ВК", work: "Гребенки", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ВК", work: "КПК", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ВК", work: "Гидравлика", responsible: "", people: 2 },
        { section: "Паркинг", subsys: "ВК", work: "Изоляция", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Монтаж сплинкеров и ДППК", responsible: "ООО \"ПСК-28\"", people: 4 },
        { section: "Паркинг", subsys: "Пожаротушение", work: "Гидравлика", responsible: "", people: 2 },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУЭ", responsible: "ООО \"Призмер\"", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АСКУВТ", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АРМ АСУД", responsible: "", people: 3 },
        { section: "Паркинг", subsys: "ПНР", work: "АОВ", responsible: "ООО \"СИДРЭ\"", people: 3 }
    ];

    const STORAGE_KEY = 'ogni3_resources_data';
    let resourcesData = [];

    // Форматирование даты
    function formatDate() {
        const now = new Date();
        return now.toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Загрузка данных
    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            resourcesData = JSON.parse(saved);
        } else {
            resourcesData = JSON.parse(JSON.stringify(initialData));
        }
        renderTable();
        document.getElementById('dateBadge').textContent = `📅 ${formatDate()}`;
    }

    // Сохранение
    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(resourcesData));
        showToast('💾 Все изменения сохранены!');
    }

    // Сброс
    function resetData() {
        if (confirm('Вы уверены, что хотите сбросить все изменения к исходным значениям?')) {
            resourcesData = JSON.parse(JSON.stringify(initialData));
            renderTable();
            saveData();
            showToast('⟳ Данные сброшены к исходным');
        }
    }

    // Сохранение в PDF
    function saveToPDF() {
        showToast('📄 Подготовка PDF...');
        const element = document.getElementById('pdfContent');
        const opt = {
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `Ресурсы_Огни3_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
            showToast('✅ PDF сохранён!');
        }).catch(() => {
            showToast('❌ Ошибка при сохранении PDF');
        });
    }

    // Отрисовка таблицы
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let currentSection = '';
        
        resourcesData.forEach((item, index) => {
            if (currentSection !== item.section) {
                currentSection = item.section;
                const sectionRow = document.createElement('tr');
                sectionRow.className = 'section-header';
                sectionRow.innerHTML = `<td colspan="5"><strong>🪖 ${item.section}</strong></td>`;
                tbody.appendChild(sectionRow);
            }
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="padding-left: 1rem;">${escapeHtml(item.subsys)}</td>
                <td>${escapeHtml(item.work)}</td>
                <td>${escapeHtml(item.responsible) || '—'}</td>
                <td style="text-align: center;">
                    <span class="editable-cell" onclick="editPeople(${index}, this)">
                        ${item.people}
                    </span>
                </td>
            `;
            tbody.appendChild(row);
        });
        
        const totalRow = document.createElement('tr');
        totalRow.className = 'grand-total';
        const totalPeople = resourcesData.reduce((sum, item) => sum + (item.people || 0), 0);
        totalRow.innerHTML = `
            <td colspan="3"><strong>📊 ИТОГО ЧЕЛОВЕК</strong></td>
            <td style="text-align: center;"><strong>${totalPeople}</strong></td>
        `;
        tbody.appendChild(totalRow);
    }
    
    window.editPeople = function(index, element) {
        const currentValue = resourcesData[index].people;
        const input = document.createElement('input');
        input.type = 'number';
        input.value = currentValue;
        input.min = 0;
        input.max = 99;
        
        const container = element;
        container.innerHTML = '';
        container.appendChild(input);
        input.focus();
        
        const saveEdit = () => {
            let newValue = parseInt(input.value, 10);
            if (isNaN(newValue)) newValue = 0;
            if (newValue < 0) newValue = 0;
            if (newValue > 99) newValue = 99;
            resourcesData[index].people = newValue;
            container.innerHTML = newValue;
            renderTable();
            showToast('✏️ Значение изменено. Не забудьте сохранить!');
        };
        
        input.addEventListener('blur', saveEdit);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });
    };
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
    
    // Инициализация
    document.getElementById('saveBtn').addEventListener('click', saveData);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    document.getElementById('pdfBtn').addEventListener('click', saveToPDF);
    
    loadData();
</script>
</body>
</html>
